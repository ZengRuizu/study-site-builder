<html lang="zh-CN" class="lang-both">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting Algorithms · demo course</title>
<!--

<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --panel2:#faf8f5; --ink:#1d1b18; --muted:#6d675e; --line:#e4ded3;
  --accent:#8a1538; --accent-soft:#f6e7ec; --amber:#b9651d; --amber-soft:#fbf0e3;
  --ok:#1f5fc8; --ok-soft:#e2ecfd; --bad:#d2361a; --bad-soft:#fde4dc; /* colour-blind safe: right = blue, wrong = red-orange */ --blue:#2d5f9a; --blue-soft:#e8f0fa;
  --code-bg:#1f1e24; --code-ink:#e8e6e3;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16151a; --panel:#1f1e25; --panel2:#24232b; --ink:#ecebe8; --muted:#a39e95; --line:#34323b;
    --accent:#e0698f; --accent-soft:#3a2230; --amber:#e7a160; --amber-soft:#3a2d1f;
    --ok:#6aa6ff; --ok-soft:#18294a; --bad:#ff7b54; --bad-soft:#47221a; --blue:#7fb0ea; --blue-soft:#1e2b3d;
    --code-bg:#121116; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65}
a{color:var(--accent)}
/* ---------- language modes ---------- */
html.lang-en .zh, html.lang-zh .en{display:none !important}
html.lang-both p.zh, html.lang-both div.zh{color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:-6px}
html.lang-both span.zh{color:var(--muted);margin-left:.35em}
html.lang-both li > span.zh, html.lang-both .opt span.zh, html.lang-both .qtext span.zh, html.lang-both .exp span.zh, html.lang-both td > span.zh, html.lang-both .card span.zh.blk{display:block;margin-left:0}
html.lang-both h1 span.zh, html.lang-both h2 span.zh, html.lang-both h3 span.zh{font-size:.8em}
html.lang-both span.zh.blk{display:block;margin:.3em 0 0;padding-left:10px;border-left:3px solid var(--line)} /* long text: Chinese on its own line, marked by a bar */
html.lang-both :is(h1,h2,h3,h4,th,.wt,.crumb,.pill) span.zh.blk{display:inline;margin:0 0 0 .35em;padding:0;border:0}
html.lang-both nav.side span.zh{display:block;margin:1px 0 0;font-size:.88em;border:0;padding:0}
/* ---------- layout ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.top .brand b{color:var(--accent)}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--ink);padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:18px;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 53px)}
nav.side{width:290px;flex:none;border-right:1px solid var(--line);background:var(--panel2);padding:14px 10px 40px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
nav.side .grp{margin-bottom:6px}
nav.side .ch{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-weight:650;padding:7px 10px;border-radius:8px;cursor:pointer}
nav.side .ch:hover{background:var(--accent-soft)}
nav.side .ch .num{display:inline-grid;place-items:center;min-width:34px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:700}
nav.side .ch.soon .num{background:var(--muted)}
nav.side .secs{margin:2px 0 6px 18px;border-left:2px solid var(--line);display:none}
nav.side .grp.open .secs{display:block}
nav.side .sec{display:flex;gap:6px;align-items:flex-start;padding:4px 10px;font-size:14px;color:var(--ink);text-decoration:none;border-radius:6px;margin-left:4px}
nav.side .sec:hover{background:var(--accent-soft)}
nav.side .sec.cur{background:var(--accent);color:#fff}
nav.side .sec .tick{width:14px;flex:none;color:var(--ok)}
nav.side .sec.cur .tick{color:#fff}
nav.side .extra{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
main{flex:1;min-width:0;padding:26px 34px 80px}
.page{max-width:920px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
h1{font-size:28px;line-height:1.3;margin:0 0 14px}
h2{font-size:21px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:17px;margin:22px 0 8px}
p{margin:8px 0}
ul,ol{margin:6px 0 10px;padding-left:24px}
li{margin:3px 0}
code.i{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px}
.kbd{font-family:var(--mono);font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
/* ---------- boxes ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.note,.warn,.tip,.exam{border-radius:10px;padding:10px 14px;margin:12px 0;border:1px solid}
.note{background:var(--blue-soft);border-color:transparent}
.tip{background:var(--ok-soft);border-color:transparent}
.warn{background:var(--bad-soft);border-color:transparent}
.exam{background:var(--amber-soft);border-color:transparent}
.note b.h,.warn b.h,.tip b.h,.exam b.h{display:block;font-size:13px;letter-spacing:.3px;text-transform:uppercase;margin-bottom:2px}
.exam b.h{color:var(--amber)} .warn b.h{color:var(--bad)} .tip b.h{color:var(--ok)} .note b.h{color:var(--blue)}
table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:14.5px;background:var(--panel)}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2);font-weight:650}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2>*,.grid3>*{min-width:0}
.vzgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media (max-width:900px){.vzgrid{grid-template-columns:1fr}}
@media (max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
/* ---------- code ---------- */
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 0;overflow:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;margin:10px 0}
pre.code .l{display:block;padding:0 14px 0 0;white-space:pre}
pre.code .l::before{content:attr(data-n);display:inline-block;width:2.6em;padding-right:.9em;text-align:right;color:#6b6873;user-select:none}
pre.code .l.hl{background:rgba(255,200,80,.18);box-shadow:inset 3px 0 0 #f5b041}
pre.code .l.click{cursor:pointer}
pre.code .l.click:hover{background:rgba(255,255,255,.06)}
.c-kw{color:#ff8fa3}.c-str{color:#a5d6a7}.c-com{color:#8a8794;font-style:italic}.c-num{color:#f6c177}.c-pre{color:#c4a7e7}.c-fn{color:#89c2ff}
/* ---------- buttons/inputs ---------- */
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{font-size:13px;padding:3px 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.in,select.in{font:inherit;font-size:14.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px}
input.in.mono{font-family:var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
/* ---------- quiz ---------- */
.qbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin:12px 0;font-size:14px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.q.right{border-color:var(--ok)} .q.wrong{border:2px dashed var(--bad)}
.q .qh{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.q .qh .no{font-weight:700;color:var(--accent)}
.q .qtext{font-weight:550}
.opts{display:grid;gap:7px;margin:10px 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;font-weight:700;color:var(--muted);width:1.3em}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.good{border:2px solid var(--ok);background:var(--ok-soft)}.opt.good::after{content:'✓';margin-left:auto;padding-left:8px;color:var(--ok);font-weight:800}
.opt.bad{border:2px dashed var(--bad);background:var(--bad-soft)}.opt.bad::after{content:'✗';margin-left:auto;padding-left:8px;color:var(--bad);font-weight:800}
.opt code,.exp code{font-family:var(--mono);font-size:.92em}
.fb{margin-top:8px;font-weight:650}
details.rv{margin:10px 0;border:1px dashed var(--line);border-radius:10px;padding:5px 12px;font-size:14.5px}
details.rv>summary{cursor:pointer;color:var(--muted);font-size:13.5px;list-style:none;user-select:none}
details.rv>summary::-webkit-details-marker{display:none}
details.rv>summary::before{content:'📎 ';}
details.rv>summary::after{content:' ▸';}
details.rv[open]>summary::after{content:' ▾';}
details.rv[open]{background:var(--panel2);padding-bottom:10px}
details.rv .rvb{margin-top:6px}
details.rv table.t{font-size:14px}
.q .xl{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;font-size:12px;padding:1px 7px;cursor:pointer}
.q .xl:hover{border-color:var(--accent);color:var(--accent)}
html.lang-both .q .xl{display:none}
.q .dk{color:var(--muted)}
html.lang-en .q.xlate :is(.qtext,.opt,.exp,.fb) span.zh, html.lang-zh .q.xlate :is(.qtext,.opt,.exp,.fb) span.en{display:block !important;color:var(--muted);font-size:.93em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.exp{margin-top:6px;padding:10px 12px;border-radius:9px;background:var(--panel2);border:1px dashed var(--line);font-size:14.5px}
/* ---------- widgets ---------- */
.w{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:16px 0;box-shadow:var(--shadow)}
.w .wt{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px;text-transform:uppercase;margin-bottom:6px}
.boxes{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:48px}
.box{min-width:42px;height:42px;display:grid;place-items:center;border-radius:8px;border:2px solid var(--line);background:var(--panel2);font-family:var(--mono);font-weight:700;transition:all .25s}
.box.a{border-color:var(--accent);background:var(--accent-soft)}
.box.b{border-color:var(--amber);background:var(--amber-soft)}
.box.g{border-color:var(--ok);background:var(--ok-soft)}
.box.dim{opacity:.35}
.box .ix{position:absolute}
.log{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap}
.msg{min-height:1.6em;font-size:14.5px;margin:6px 0}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.done-row{display:flex;justify-content:center;margin-top:26px}
.hero{background:linear-gradient(135deg,var(--accent) 0%,#5b0d26 100%);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:18px}
.hero h1{color:#fff;margin:0 0 6px}
html.lang-both .hero span.zh{color:#f3d6df}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chcard{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.chcard:hover{border-color:var(--accent)}
.chcard .n{font-size:12px;font-weight:700;color:var(--accent)}
.chcard .bar{height:6px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.chcard .bar i{display:block;height:100%;background:var(--ok)}
.svgbox{overflow-x:auto}
.svgbox svg{max-width:100%;height:auto}
svg text{font-family:var(--sans)}
/* bilingual SVG labels: sv-en / sv-zh / sv-both */
html:not(.lang-en) .sv-en, html:not(.lang-zh) .sv-zh, html:not(.lang-both) .sv-both{display:none}
/* ---------- visual helpers ---------- */
.big-idea{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:14px 18px;margin:12px 0;font-size:16.5px}
.big-idea .ico{font-size:30px;flex:none}
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.vcard .pic{display:flex;justify-content:center;align-items:center;min-height:110px;margin:4px 0 8px}
.vcard .pic svg{max-width:100%;height:auto}
.vcard h4{margin:0 0 4px;font-size:15.5px}
.vcard .cap{font-size:14px;color:var(--ink)}
.vcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tag-ok{color:var(--ok);font-weight:700}.tag-no{color:var(--bad);font-weight:700}
/* org-chart tree built from nested <ul> */
.otree{overflow-x:auto;padding:6px 0 4px}
.otree ul{position:relative;display:flex;justify-content:center;margin:0;padding:18px 0 0}
.otree > ul{padding-top:0}
.otree li{list-style:none;position:relative;padding:18px 5px 0;display:flex;flex-direction:column;align-items:center;margin:0}
.otree li::before,.otree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:18px;border-top:2px solid var(--muted)}
.otree li::after{right:auto;left:50%;border-left:2px solid var(--muted)}
.otree li:only-child::before,.otree li:only-child::after{display:none}
.otree li:only-child{padding-top:0}
.otree li:first-child::before,.otree li:last-child::after{border:0 none}
.otree li:last-child::before{border-right:2px solid var(--muted);border-radius:0 7px 0 0}
.otree li:first-child::after{border-radius:7px 0 0 0}
.otree ul ul::before{content:'';position:absolute;top:0;left:50%;height:18px;border-left:2px solid var(--muted)}
.otree .nd{display:inline-block;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.35;text-align:center;white-space:nowrap}
.otree .nd.r{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.otree .nd.g1{border-color:var(--blue);background:var(--blue-soft)}
.otree .nd.g2{border-color:var(--ok);background:var(--ok-soft)}
.otree .nd.g3{border-color:var(--amber);background:var(--amber-soft)}
.otree .nd.leaf{cursor:pointer}
.otree .nd.leaf:hover,.otree .nd.leaf.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.otree .nd small{display:block;color:var(--muted);font-size:11.5px}
/* chain of nodes (linear structures) */
.chain{display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 2px;gap:0}
.chain .nb{min-width:44px;height:42px;display:grid;place-items:center;border:2px solid var(--line);border-radius:9px;background:var(--panel2);font-family:var(--mono);font-weight:700;flex:none;transition:all .25s;position:relative}
.chain .nb.new{border-color:var(--ok);background:var(--ok-soft);transform:scale(1.08)}
.chain .nb.rm{cursor:pointer}
.chain .nb.rm:hover{border-color:var(--bad);background:var(--bad-soft)}
.chain .nb.lk{cursor:not-allowed}
.chain .ar{color:var(--muted);font-size:15px;flex:none;width:14px;text-align:center}
.chain .slot{flex:none;width:26px;height:42px;display:grid;place-items:center;border-radius:7px;font-size:13px;cursor:pointer;user-select:none}
.chain .slot.ok{border:2px dashed var(--ok);color:var(--ok);background:transparent}
.chain .slot.ok:hover{background:var(--ok-soft)}
.chain .slot.no{border:2px dashed var(--line);color:var(--muted);opacity:.7}
.chain .endl{font-size:11px;color:var(--muted);flex:none;padding:0 4px;text-align:center;line-height:1.2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s 2}
.flow{display:flex;flex-direction:column;gap:8px}
.flow .qbox{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-weight:600}
.flow .ans{border:2px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px}
.flow .path{font-size:13px;color:var(--muted)}
@media (max-width:900px){
  .menu-btn{display:inline-block}
  nav.side{position:fixed;left:0;top:53px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.menu nav.side{transform:none}
  main{padding:18px 14px 70px}
  .top .brand small{display:none}
}
@media (max-width:600px){table.t{display:block;overflow-x:auto;max-width:100%}}
.hist{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);margin-right:6px;white-space:nowrap}
.hist i,.mast i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line)}
.hist i.y,.mast i.y{background:var(--ok)}.hist i.n,.mast i.n{background:var(--bad)}
.hist .hc{margin-left:4px}.hist.m .hc{color:var(--ok);font-weight:600}.hist.r .hc{color:var(--bad)}.hist.new{opacity:.7}
.mast{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}.mast i{margin-left:6px}
.wrec{font-size:12px;font-weight:400;color:var(--muted)}
@media (max-width:600px){.hist .ht{display:none}}
.focus{border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--panel2);border-radius:10px;padding:10px 14px;margin:6px 0 18px;font-size:14.5px}
.focus.slim{padding:7px 12px;font-size:13.5px}
.focus .stars,.t .stars{color:var(--amber);letter-spacing:1px}
.focus .frow{display:flex;gap:10px;margin-top:6px}.focus .flab{flex:0 0 6.5em;color:var(--muted);font-size:13px}
.focus .fsecs{display:flex;flex-wrap:wrap;gap:5px}
.prio{display:inline-block;font-size:12.5px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);text-decoration:none;color:inherit}
.prio.must{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);font-weight:650}
.prio.core{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.prio.low{opacity:.75}.prio.skip{opacity:.6;text-decoration:line-through}
.sec.p-skip>span:last-child{opacity:.5;text-decoration:line-through}.sec.p-low>span:last-child{opacity:.75}.sec.p-must .tick{color:var(--amber)}
.ch .hrs{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;white-space:nowrap}
.fbar{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:4px;margin-right:6px;vertical-align:middle;overflow:hidden}.fbar i{display:block;height:100%;background:var(--accent)}
@media (max-width:600px){.focus .frow{flex-direction:column;gap:2px}.focus .flab{flex:none}}
@media (max-width:480px){.top .brand .mr{display:none}.glbtn .glt{display:none}.top{gap:8px;padding:10px 12px}}
/* ---- glossary ---- */
/* ---------- glossary: dotted words in English text show Chinese on hover / tap ---------- */
.gl{border-bottom:1.5px dotted var(--amber);cursor:help}
.gl:hover{background:var(--amber-soft)}
html.nogl .gl{border-bottom:0;cursor:inherit;background:none}
#gltip{position:fixed;z-index:60;display:none;background:#26252b;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:260px;pointer-events:none}
#gltip small{display:block;color:#f5c97a;font-size:12px;margin-top:2px}
.glbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.glbtn.on{border-color:var(--amber);background:var(--amber-soft)}
/* ---- practice widgets ---- */
/* ---------- practice widgets: bucket game, flashcards, code cloze ---------- */
.bk-pool{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:2px dashed var(--line);border-radius:10px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 10px;font-size:14px;cursor:grab;user-select:none;max-width:100%;line-height:1.35}
.chip.code{font-family:var(--mono);font-size:13px}
.chip.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px var(--blue-soft)}
.chip.bad{border:2px dashed var(--bad);background:var(--bad-soft)}
.chip.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;font-size:13px;padding:3px 8px}
html.lang-both .chip span.zh{display:block;margin-left:0}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@media (max-width:600px){.bk-grid{grid-template-columns:1fr 1fr}.bucket{min-height:64px}}
.bucket{border:2px solid var(--line);border-radius:11px;padding:8px;min-height:90px;background:var(--panel2);cursor:pointer;transition:all .15s}
.bucket:hover,.bucket.over{border-color:var(--accent);background:var(--accent-soft)}
.bucket .bh{font-weight:700;font-size:14px;margin-bottom:6px}
.bucket .bi{display:flex;flex-wrap:wrap;gap:4px}
.fc{perspective:1200px;cursor:pointer;margin:10px 0}
.fc-in{position:relative;min-height:200px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 22px;border-radius:14px;border:2px solid var(--line);background:var(--panel);overflow:auto}
.fc-front{border-color:var(--accent);font-size:22px;font-weight:700}
.fc-back{transform:rotateY(180deg);background:var(--ok-soft);border-color:var(--ok);font-size:16.5px}
.fc-face small{font-size:12px;color:var(--muted);font-weight:400;margin-top:8px}
html.lang-both .fc-face span.zh{display:block;margin-left:0;font-size:.85em}
pre.code input.cz{font-family:var(--mono);font-size:13.5px;background:#34323c;color:#fff;border:0;border-bottom:2px dashed #f5b041;border-radius:3px;padding:0 3px;margin:0 1px;text-align:center}
pre.code input.cz.ok{border:2px solid #6aa6ff;background:#1b3360}
pre.code input.cz.no{border:2px dashed #ff7b54;background:#5a1f12;text-decoration:line-through;text-decoration-color:#ff7b54}
</style>

<body>
<noscript><div style="max-width:640px;margin:40px auto;padding:20px 22px;border:2px solid #d2361a;border-radius:12px;font:16px/1.6 system-ui,sans-serif;background:#fff;color:#1d1d1f">
<b>⚠️ This viewer does not run JavaScript, so the study page cannot start.</b><br>
Open the same file in a real browser: on a computer, double-click it (Chrome / Edge / Safari / Firefox). On an Android phone: tap ⋮ / “Open with” → <b>Chrome</b>. Previews inside chat apps, Files / Drive apps and e-mail cannot run it.

请用真正的浏览器打开同一个文件：电脑上直接双击（Chrome / Edge / Safari / Firefox）；安卓手机：点 ⋮ 或“用其他应用打开” → 选 <b>Chrome</b>。聊天软件、网盘/文件 App、邮件里的“预览”都打不开它。</div></noscript>

  <div class="sp"></div>
  <button class="glbtn" id="glbtn" title="Underlined English words: tap for Chinese / 英文单词点一下看中文">📖<span class="glt"> <span class="en">Word help</span><span class="zh">查词</span></span></button>
  <div class="seg" id="langseg">

  </div>

<script>
/* ===== engine.js ===== */
/* =====================================================================
   study-site-builder ENGINE — generic, course-independent.
   Course content registers itself with SITE.chapter(), SITE.bank(), SITE.widgets, DECK.*, SITE.GLOSS, SITE.RVX.
   ===================================================================== */
/* =====================================================================
   CORE ENGINE
   ===================================================================== */
const SITE = { chapters: [], banks: {}, widgets: {}, course: {}, GLOSS: {}, RVX: {} };
const DSA = SITE;   // alias: older course files use DSA.*

/* ---- storage (wrapped: storage may be unavailable). Keys are namespaced per course id, because
   every file:// page in a browser shares one localStorage. ---- */
const lsKey = k => (SITE.course.id || 'site') + ':' + k;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(lsKey(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); } catch (e) {} }
};

/* ---- tiny helpers ---- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function attr(s) { return esc(s).replace(/"/g, '&quot;'); }
/** inline bilingual text */
/* Long text (over ~40 characters, or containing block markup) gets class "blk": in 双语 mode the Chinese then starts on its own line
   instead of running on after the English sentence. Short labels stay inline. */
function T(en, zh) { const s = String(en), b = s.replace(/<[^>]+>/g, '').replace(/&[#a-z0-9]+;/gi, 'x').length > 40 || /<(br|p|ul|ol|div|table)\b/i.test(s) ? ' blk' : '';
  return `<span class="en${b}">${en}</span><span class="zh${b}">${zh == null ? en : zh}</span>`; }
/** paragraph bilingual */
function P(en, zh) { return `<p class="en">${en}</p><p class="zh">${zh}</p>`; }
/** list of bilingual items */
function L(items, ordered) { const t = ordered ? 'ol' : 'ul'; return `<${t}>` + items.map(x => `<li>${Array.isArray(x) ? T(x[0], x[1]) : x}</li>`).join('') + `</${t}>`; }
/** callout boxes: kind = note | tip | warn | exam */
function BOX(kind, en, zh) {
  const head = { note: ['Note', '注意'], tip: ['Tip', '技巧'], warn: ['Common mistake', '易错点'], exam: ['Exam focus', '考点'] }[kind];
  return `<div class="${kind}"><b class="h">${T(head[0], head[1])}</b>${T(en, zh)}</div>`;
}
/** collapsible, low-key refresher for background knowledge the slides assume */
function RV(en, zh, body) { return `<details class="rv"><summary>${T('Refresher: ' + en, '知识回顾：' + zh)}</summary><div class="rvb">${body}</div></details>`; }
/** inline code */
function K(s) { return `<code class="i">${esc(s)}</code>`; }
/** quiz placeholder: chapter bank + group */
function QZ(ch, group, title, tag) { return `<div class="quizmount" data-ch="${ch}" data-g="${group || ''}" data-tag="${tag || ''}" data-title="${title ? attr(JSON.stringify(title)) : ''}"></div>`; }
/** widget placeholder */
function W(name, arg) { return `<div class="wmount" data-w="${name}" data-arg="${arg ? attr(JSON.stringify(arg)) : ''}"></div>`; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function distinctInts(n, lo, hi) { const s = new Set(); while (s.size < n) s.add(rint(lo, hi)); return shuffle([...s]); }

/* ---- C++ highlighter ---- */
const KW = new Set(('int double float char bool void long short unsigned const class struct public private protected return if else for while do new delete true false ' +
  'using namespace typedef enum this friend static sizeof break continue switch case default string fstream ifstream ofstream reinterpret_cast std cout cin endl ios').split(' '));
function hlLine(s) {
  const re = /(\/\/.*$|\/\*.*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#\w+)|\b(\d+\.?\d*L?)\b|([A-Za-z_]\w*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    if (m[1]) out += `<span class="c-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="c-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="c-pre">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="c-num">${m[4]}</span>`;
    else if (m[5]) out += KW.has(m[5]) ? `<span class="c-kw">${m[5]}</span>` : (/^\s*\(/.test(s.slice(re.lastIndex)) ? `<span class="c-fn">${m[5]}</span>` : esc(m[5]));
    last = re.lastIndex;
  }
  return out + esc(s.slice(last));
}
function dedent(raw) {
  let lines = raw.replace(/^\n/, '').replace(/\s+$/, '').split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(ind));
}
function codeHTML(raw, cls) {
  const lines = dedent(raw);
  return `<pre class="code ${cls || ''}"><code>` + lines.map((l, i) => `<span class="l" data-n="${i + 1}">${hlLine(l) || ' '}</span>`).join('') + `</code></pre>`;
}
/** tagged template for code: C`...` keeps backslashes raw */
function C(s, ...v) { return codeHTML(String.raw(s, ...v)); }
function highlightLines(pre, lines) { $$('.l', pre).forEach((el, i) => el.classList.toggle('hl', lines.includes(i + 1))); }

/* ---- language ---- */
function setLang(l) {
  const h = document.documentElement; h.classList.remove('lang-en', 'lang-zh', 'lang-both'); h.classList.add('lang-' + l);
  $$('#langseg button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  LS.set('lang', l);
}

/* ---- registration ---- */
SITE.chapter = function (ch) { SITE.chapters.push(ch); };
SITE.bank = function (ch, list) {
  const arr = (SITE.banks[ch] = SITE.banks[ch] || []);
  list.forEach(q => { q.ch = ch; q.id = q.id || ch + '-' + (arr.length + 1); arr.push(q); });
};
SITE.allQs = () => Object.values(SITE.banks).flat();
SITE.findQ = id => SITE.allQs().find(q => q.id === id);

/* ---- progress ---- */
const done = () => LS.get('done', {});
function markDone(key, v) { const d = done(); if (v) d[key] = 1; else delete d[key]; LS.set('done', d); }

/* =====================================================================
   QUIZ ENGINE
   q = { t:'mcq'|'multi'|'fill'|'gen', g:'group', q:[en,zh], code:`raw`, o:[[en,zh]|'same'], a:index|[indexes]|['accepted answers'], e:[en,zh], ecode:`raw` }
   'gen' : { t:'gen', g, make: () => (a normal question object) }  → regenerated each time
   ===================================================================== */
function normAns(s) { return String(s).toLowerCase().replace(/[\[\]{}()]/g, ' ').replace(/[,;\s]+/g, ' ').replace(/\s*([+*\/^=-])\s*/g, '$1').trim(); }
function optHTML(o) { return Array.isArray(o) ? T(o[0], o[1]) : o; }
function stats() { return LS.get('stats', {}); }
/* per-question history: stats[id] = { c: right, w: wrong, h: last 8 results as '1'/'0', t: last time }.
   A random generator is tracked under its own id. Mastered = the last two attempts were both right. */
function recordAnswer(q, ok, inMistakes, id, given) {
  id = id || q.id; if (!id) return;
  const s = stats(); const r = s[id] || { c: 0, w: 0 }; ok ? r.c++ : r.w++; r.h = ((r.h || '') + (ok ? '1' : '0')).slice(-8); r.t = Date.now();
  if (given != null) r.g = String(given).slice(0, 120);                       // what the student answered last time
  if (q.gen) { r.gq = plain(q.q[0]).slice(0, 200); r.ga = ansText(q).slice(0, 120); if (q.code) r.gc = q.code.slice(0, 400); }  // a random instance: keep the actual question
  s[id] = r; LS.set('stats', s);
  if (q.gen) return;
  const wb = new Set(LS.get('wrong', []));
  if (!ok) wb.add(q.id); else if (inMistakes) wb.delete(q.id);
  LS.set('wrong', [...wb]);
}
function plain(h) { return String(h == null ? '' : h).replace(/<br\s*\/?>/g, ' / ').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim(); }
function optPlain(o) { return plain(Array.isArray(o) ? o[0] : o); }
function ansText(q) { const L = 'ABCDEFGH';
  if (q.t === 'mcq') return L[q.a] + '. ' + optPlain(q.o[q.a]);
  if (q.t === 'multi') return q.a.map(i => L[i] + '. ' + optPlain(q.o[i])).join(' + ');
  if (q.t === 'fill') return String(q.a[0]); return ''; }
function qMastered(r) { return !!r && (r.h ? /11$/.test(r.h) : (r.w === 0 && r.c >= 2)); }
function qState(id) { const r = stats()[id]; return !r || !(r.c + r.w) ? 'new' : qMastered(r) ? 'mastered' : 'review'; }
function agoText(t) { if (!t) return ''; const m = Math.round((Date.now() - t) / 60000); return m < 60 ? T(m + ' min ago', m + ' 分钟前') : m < 1440 ? T(Math.round(m / 60) + ' h ago', Math.round(m / 60) + ' 小时前') : T(Math.round(m / 1440) + ' d ago', Math.round(m / 1440) + ' 天前'); }
function histHTML(id) {
  const r = stats()[id];
  if (!r || !(r.c + r.w)) return `<span class="hist new">${T('new', '未做过')}</span>`;
  const m = qMastered(r), dots = (r.h || '').split('').map(x => `<i class="${x === '1' ? 'y' : 'n'}"></i>`).join('');
  return `<span class="hist ${m ? 'm' : 'r'}" title="right 对 ${r.c} · wrong 错 ${r.w}">${dots}<span class="hc">${m ? '✓ ' + T('mastered', '已掌握') : T('review', '待复习')} · ${r.c}✓ ${r.w}✗</span><span class="ht"> · ${agoText(r.t)}</span></span>`;
}
/* small "last / best" memory for practice widgets (cloze, judge drill, answer sheets) */
function enOnly(h) { return plain(String(h).replace(/<span class="zh">[\s\S]*?<\/span>/g, '')); }
function wRec(key, got, n, label) { const all = LS.get('wrec', {}); const r = all[key] || { n: 0 }; r.n++; if (label) r.lb = enOnly(label).slice(0, 100); r.last = got; r.of = n; const pct = n ? Math.round(got / n * 100) : 0;
  r.bp = Math.max(r.bp != null ? r.bp : (r.best != null && r.of ? Math.min(100, Math.round(r.best / r.of * 100)) : 0), pct); delete r.best; r.t = Date.now(); all[key] = r; LS.set('wrec', all); }
function wRecHTML(key) { const r = LS.get('wrec', {})[key]; return r ? `<span class="wrec">${T('Last', '上次')} ${r.last}/${r.of} · ${T('best', '最好')} ${r.bp != null ? r.bp : Math.min(100, Math.round((r.best || 0) / (r.of || 1) * 100))}% · ${T('done', '做过')} ${r.n}× · ${agoText(r.t)}</span>` : ''; }
function renderQuestion(q, no, opts = {}) {
  let cur = q.t === 'gen' ? Object.assign(q.make(), { gen: true, g: q.g }) : q;
  const el = document.createElement('div'); el.className = 'q';
  const draw = () => {
    el.className = 'q';
    const DK = `<button class="btn sm dk" title="Count it as wrong and show the answer">🤷 ${T('Don’t know', '不会')}</button>`;
    const tag = cur.gen ? `<span class="pill">${T('Random drill', '随机生成')}</span>` : '';
    let h = `<div class="qh"><span class="no">Q${no}</span>${tag}${opts.showCh ? `<span class="pill">${q.ch.toUpperCase()}</span>` : ''}<span style="flex:1"></span>${q.id ? histHTML(q.id) : ''}<button class="xl" title="translate this question / 翻译本题"><span class="en">中文</span><span class="zh">EN</span></button></div>`;
    h += `<div class="qtext">${T(cur.q[0], cur.q[1])}</div>`;
    if (cur.code) h += codeHTML(cur.code);
    if (cur.html) h += cur.html;
    if (cur.t === 'mcq' || cur.t === 'multi') {
      h += `<div class="opts">` + cur.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${'ABCDEFGH'[i]}</span><span>${optHTML(o)}</span></button>`).join('') + `</div>`;
      if (cur.t === 'multi') h += `<div class="row"><span style="font-size:13px;color:var(--muted)">${T('Select all that apply', '多选：选出全部正确项')}</span><button class="btn sm pri chk">${T('Check', '提交')}</button>${DK}</div>`;
      else h += `<div class="row">${DK}</div>`;
    } else if (cur.t === 'fill') {
      h += `<div class="row"><input class="in mono ans" style="flex:1;min-width:220px" placeholder="${cur.ph || 'answer'}"><button class="btn pri chk">${T('Check', '提交')}</button>${DK}</div>`;
    }
    h += `<div class="res"></div>`;
    if (cur.gen && !opts.deferred) h += `<div class="row"><button class="btn sm regen">🎲 ${T('New question', '换一题')}</button></div>`;
    el.innerHTML = h;
    const res = $('.res', el);
    const finish = (ok, shown, paint, given) => {
      recordAnswer(cur, ok && !shown, opts.inMistakes, q.id, shown ? "(don't know)" : given);
      const hs = $('.hist', el); if (hs && !opts.deferred) hs.outerHTML = histHTML(q.id);
      opts.onAnswer && opts.onAnswer(ok && !shown, cur);
      const reveal = () => { paint && paint(); finishShow(ok, shown); };
      if (opts.deferred) { el._reveal = reveal; res.innerHTML = `<div class="fb" style="color:var(--blue)">${shown ? '🤷 ' + T('Marked as don’t know', '已标记为不会') : T('Answer recorded', '已作答')}</div>`; }
      else reveal();
    };
    const finishShow = (ok, shown) => {
      el.classList.add(ok ? 'right' : 'wrong');
      let fb = shown ? `<div class="fb no">🤷 ${T('Marked “don’t know” — saved to the mistake bank. Here is the answer:', '已标记“不会”——已放进错题本。答案如下：')}</div>` : `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? T('✓ Correct', '✓ 正确') : T('✗ Not quite', '✗ 错了')}</div>`;
      if (cur.t === 'fill') fb += `<div style="margin-top:4px">${T('Answer', '答案')}: <code style="font-family:var(--mono)">${esc(cur.a[0])}</code></div>`;
      if (cur.e) fb += `<div class="exp">${T(cur.e[0], cur.e[1])}${cur.ecode ? codeHTML(cur.ecode) : ''}</div>`;
      res.innerHTML = fb;
    };
    if (cur.t === 'mcq') {
      $$('.opt', el).forEach(b => b.onclick = () => {
        if (el.dataset.done) return; el.dataset.done = 1;
        const i = +b.dataset.i, ok = i === cur.a;
        b.classList.add('sel');
        finish(ok, false, () => { b.classList.remove('sel'); $$('.opt', el).forEach(x => { if (+x.dataset.i === cur.a) x.classList.add('good'); }); if (!ok) b.classList.add('bad'); }, 'ABCDEFGH'[i] + '. ' + optPlain(cur.o[i]));
      });
    } else if (cur.t === 'multi') {
      $$('.opt', el).forEach(b => b.onclick = () => { if (!el.dataset.done) b.classList.toggle('sel'); });
      $('.chk', el).onclick = () => {
        if (el.dataset.done) return; el.dataset.done = 1;
        const sel = $$('.opt.sel', el).map(b => +b.dataset.i).sort().join();
        const ok = sel === cur.a.slice().sort().join();
        finish(ok, false, () => $$('.opt', el).forEach(b => { const i = +b.dataset.i; if (cur.a.includes(i)) b.classList.add('good'); else if (b.classList.contains('sel')) b.classList.add('bad'); b.classList.remove('sel'); }), sel.split(',').filter(x => x !== '').map(i => 'ABCDEFGH'[+i]).join(' + ') || '(nothing)');
      };
    } else if (cur.t === 'fill') {
      const inp = $('.ans', el);
      const check = () => {
        if (el.dataset.done) return; if (!inp.value.trim()) return;
        el.dataset.done = 1;
        const v = normAns(inp.value); const ok = cur.a.some(a => normAns(a) === v);
        finish(ok, false, null, inp.value.trim());
      };
      $('.chk', el).onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
    }
    $('.dk', el).onclick = () => {
      if (el.dataset.done) return; el.dataset.done = 1;
      finish(false, true, () => $$('.opt', el).forEach(x => { const i = +x.dataset.i; x.classList.remove('sel'); if (cur.t === 'mcq' ? i === cur.a : (cur.a || []).includes && cur.t === 'multi' && cur.a.includes(i)) x.classList.add('good'); }));
    };
    $('.xl', el).onclick = () => el.classList.toggle('xlate');
    const rg = $('.regen', el);
    if (rg) rg.onclick = () => { cur = Object.assign(q.make(), { gen: true, g: q.g }); delete el.dataset.done; draw(); };
  };
  draw();
  return el;
}

  if (m && m.fmt < SAVE_FMT) { let d = saveRead(); for (let f = m.fmt; f < SAVE_FMT; f++) d = SAVE_MIGRATE[f](d); try { saveWriteAll(d); } catch (e) {} }

async function saveExport() {

/* =====================================================================
   ===== GLOSSARY (tap an underlined English word → Chinese; saved to 生词本)
   Add words here: 'english word or phrase': '中文'
   ===================================================================== */
let GL_RE = null;
function glRegex() {
  if (GL_RE) return GL_RE;
  const ks = Object.keys(SITE.GLOSS || {});
  GL_RE = ks.length ? new RegExp('\\b(' + ks.sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\-]/g, '\\$&')).join('|') + ')\\b', 'gi') : /(?!)/g;
  return GL_RE;
}
const glOn = () => LS.get('gloss', true);
const GL_SKIP = /^(CODE|PRE|INPUT|TEXTAREA|SCRIPT|STYLE|SELECT|OPTION|text|tspan|svg)$/;
let glBusy = false;
function glossify(root) {
  if (!glOn() || !root || !root.querySelectorAll) return;
  const targets = root.matches && root.matches('.en') ? [root] : [];
  root.querySelectorAll('.en').forEach(e => targets.push(e));
  glBusy = true;
  targets.forEach(t => {
    const walker = document.createTreeWalker(t, NodeFilter.SHOW_TEXT, { acceptNode: n => {
      for (let p = n.parentNode; p && p !== t.parentNode; p = p.parentNode) { if (p.nodeType === 1 && (GL_SKIP.test(p.nodeName) || p.classList.contains('gl') || p.classList.contains('code') || p.classList.contains('i'))) return NodeFilter.FILTER_REJECT; }
      const RE = glRegex(); RE.lastIndex = 0; return RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const RE = glRegex(); const s = n.nodeValue, frag = document.createDocumentFragment(); let last = 0, m; RE.lastIndex = 0;
      while ((m = RE.exec(s))) { frag.appendChild(document.createTextNode(s.slice(last, m.index))); const sp = document.createElement('span'); sp.className = 'gl'; sp.textContent = m[0]; sp.dataset.k = m[0].toLowerCase(); frag.appendChild(sp); last = RE.lastIndex; }
      frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag, n);
    });
  });
  glBusy = false;
}
/* tooltip + save to vocabulary list */
(function () {
  const tip = document.createElement('div'); tip.id = 'gltip'; document.body.appendChild(tip);
  let hideT;
  const show = (el, saved) => {
    const k = el.dataset.k, zh = SITE.GLOSS[k]; if (!zh) return;
    tip.innerHTML = `<b>${esc(el.textContent)}</b> — ${esc(zh)}${saved ? '<small>✓ 已加入生词本 / saved to vocabulary list</small>' : '<small>点击加入生词本 / tap to save</small>'}`;
    tip.style.display = 'block';
    const r = el.getBoundingClientRect(); const w = tip.offsetWidth;
    tip.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
    tip.style.top = (r.top > 70 ? r.top - tip.offsetHeight - 6 : r.bottom + 6) + 'px';
    clearTimeout(hideT); if (saved) hideT = setTimeout(() => tip.style.display = 'none', 1800);
  };
  document.addEventListener('mouseover', e => { const g = e.target.closest && e.target.closest('.gl'); if (g && glOn()) show(g, false); });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.gl')) { clearTimeout(hideT); hideT = setTimeout(() => tip.style.display = 'none', 150); } });
  window.addEventListener('scroll', () => tip.style.display = 'none', { passive: true });
  // capture phase: a tap on a word must NOT also answer a question / press a button
  document.addEventListener('click', e => {
    const g = e.target.closest && e.target.closest('.gl'); if (!g || !glOn()) return;
    e.stopPropagation(); e.preventDefault();
    const v = LS.get('vocab', {}); const k = g.dataset.k; v[k] = { zh: SITE.GLOSS[k], n: ((v[k] && v[k].n) || 0) + 1, t: Date.now() }; LS.set('vocab', v);
    show(g, true); const sb = $('#vocabcount'); if (sb) sb.textContent = Object.keys(v).length;
  }, true);
})();
/* re-glossify whatever gets rendered into the page */
new MutationObserver(muts => {
  if (glBusy || !glOn()) return;
  const roots = new Set(); muts.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1 && !n.classList.contains('gl')) roots.add(n); }));
  roots.forEach(r => glossify(r));
}).observe(document.getElementById('page'), { childList: true, subtree: true });

/** default mock-paper split: proportional to each built chapter's question count, at least 1 each */
function mockSplit(n) {
  const chs = SITE.chapters.filter(c => !c.soon && (SITE.banks[c.id] || []).length);
  const tot = chs.reduce((a, c) => a + SITE.banks[c.id].length, 0) || 1; const per = {};
  chs.forEach(c => per[c.id] = Math.max(1, Math.round(n * SITE.banks[c.id].length / tot)));
  return per;
}
/* =====================================================================
   ===== MOCK EXAM — random mixed paper, answers revealed only on submit
   ===================================================================== */
SITE.mockRender = page => {
  const plans = { quick: { n: 15, min: 25, per: (SITE.course.mock && SITE.course.mock.quick) || mockSplit(15) },
                  full: { n: 30, min: 50, per: (SITE.course.mock && SITE.course.mock.full) || mockSplit(30) } };
  const best = LS.get('mockbest', null);
  page.innerHTML = `<h1>📝 ${T('Mock exam', '模拟考')}</h1>
  ${P('A random paper drawn from every chapter, including freshly generated 🎲 tracing questions. <b>No feedback until you submit</b> — like the real exam. Wrong answers go into the mistake bank.', '从每一章随机抽题，包括现场生成的 🎲 追踪题。<b>交卷前不显示对错</b>——和真实考试一样。答错的题会进错题本。')}
  <div class="grid2"><div class="card"><b>${T('Quick paper', '短卷')}</b><br>15 ${T('questions', '题')} · ~25 min<div class="row"><button class="btn pri" data-p="quick">${T('Start', '开始')}</button></div></div>
  <div class="card"><b>${T('Full paper', '整卷')}</b><br>30 ${T('questions', '题')} · ~50 min<div class="row"><button class="btn pri" data-p="full">${T('Start', '开始')}</button></div></div></div>
  ${best ? `<div class="note">${T('Best score so far', '历史最高')}: <b>${best}%</b></div>` : ''}
  <div id="mockarea"></div>`;
  $$('[data-p]', page).forEach(b => b.onclick = () => start(plans[b.dataset.p]));

  function start(plan) {
    const qs = [];
    Object.entries(plan.per).forEach(([ch, k]) => {
      const bank = SITE.banks[ch] || []; const gens = shuffle(bank.filter(q => q.t === 'gen')), fixed = shuffle(bank.filter(q => q.t !== 'gen'));
      const nGen = gens.length ? Math.min(gens.length, Math.ceil(k / 2)) : 0;
      gens.slice(0, nGen).forEach(q => qs.push(q)); fixed.slice(0, k - nGen).forEach(q => qs.push(q));
    });
    const area = $('#mockarea'); area.innerHTML = '';
    $$('[data-p]', page).forEach(b => b.disabled = true);
    const t0 = Date.now(), results = new Map();
    const bar = document.createElement('div'); bar.className = 'qbar'; bar.style.position = 'sticky'; bar.style.top = '60px'; bar.style.zIndex = 5;
    area.appendChild(bar);
    const els = [];
    qs.forEach((q, i) => { const el = renderQuestion(q, i + 1, { deferred: true, showCh: true, onAnswer: (ok) => { results.set(i, ok); upd(); } }); el.dataset.ch = q.ch; els.push(el); area.appendChild(el); });
    const sub = document.createElement('div'); sub.className = 'row'; sub.style.justifyContent = 'center';
    sub.innerHTML = `<button class="btn pri" style="font-size:16px;padding:10px 26px">${T('Submit paper', '交卷')}</button>`; area.appendChild(sub);
    let timer = setInterval(upd, 1000), submitted = false;
    function upd() {
      if (!document.body.contains(bar)) return clearInterval(timer);
      const sec = Math.floor((Date.now() - t0) / 1000), left = plan.min * 60 - sec;
      bar.innerHTML = `<b>${T('Mock exam', '模拟考')}</b><span>${T('Answered', '已答')} ${results.size}/${qs.length}</span><span style="flex:1"></span><span style="font-family:var(--mono);color:${left < 0 ? 'var(--bad)' : 'inherit'}">⏱ ${left < 0 ? '+' : ''}${Math.floor(Math.abs(left) / 60)}:${String(Math.abs(left) % 60).padStart(2, '0')}</span>`;
    }
    upd();
    $('button', sub).onclick = () => {
      if (submitted) return;
      if (results.size < qs.length && !sub.dataset.warned) { sub.dataset.warned = 1; sub.insertAdjacentHTML('afterbegin', `<div class="warn" style="width:100%">${T(`${qs.length - results.size} question(s) unanswered. Click Submit again to hand in anyway.`, `还有 ${qs.length - results.size} 题没答。再点一次交卷即可强制提交。`)}</div>`); return; }
      submitted = true; clearInterval(timer); els.forEach(e => e.dataset.done = 1);
