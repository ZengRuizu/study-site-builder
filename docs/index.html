<script>
/* ===== ../../addons/cs-algorithms/sim.js ===== */
/* =====================================================================
   ===== Exact simulators of the classic algorithms used by the answer-sheet drills
   Pure functions (no DOM) so they can be checked in Node.
   ===================================================================== */
const T1 = {};

/** partition() (first-element pivot, the classic textbook version): pivot = list[pivotIdx] (default first), bottom = first, top = last.
 *  Each loop iteration: top moves left while > pivot, bottom moves right while < pivot,
 *  then swap if bottom < top, else return top.  Returns {steps, cut, a, pivot}. */
T1.partition = (arr, first = 0, last = arr.length - 1, pivotIdx = first) => {
  const a = arr.slice(), pivot = a[pivotIdx], steps = [];
  let bottom = first, top = last, guard = 0;
  while (true) {
    if (++guard > 200) throw new Error('DUP');
    while (a[top] > pivot) top--;
    while (a[bottom] < pivot) bottom++;
    if (bottom < top) {
      const x = a[bottom], y = a[top]; a[bottom] = y; a[top] = x;
      steps.push({ bottom, top, swap: [x, y], a: a.slice() });
    } else { steps.push({ bottom, top, cut: top, a: a.slice() }); return { steps, cut: top, a, pivot, first, last }; }
  }
};

/** merge(list, first, mid, last) trace rows in the usual exam-table layout:
 *  each row = indices/values compared (or '-' if that half is used up) and tempArray after the move. */
T1.mergeRows = (list, first, mid, last) => {
  let f1 = first, f2 = mid + 1; const tmp = [], rows = [], n = last - first + 1;
  while (tmp.length < n) {
    const v1 = f1 <= mid ? list[f1] : null, v2 = f2 <= last ? list[f2] : null;
    const row = { f1, f2, v1, v2 };
    if (v2 === null || (v1 !== null && v1 <= v2)) { tmp.push(v1); f1++; } else { tmp.push(v2); f2++; }
    row.tmp = tmp.slice(); rows.push(row);
  }
  return rows;
};

/** merge sort recursion tree (mid = (first + last) / 2, left half includes mid) */
T1.mergeTree = (arr) => {
  const a = arr.slice(), calls = [];
  const ms = (f, l, d) => {
    const node = { f, l, d, before: a.slice(f, l + 1) }; calls.push(node);
    if (f < l) { const m = Math.floor((f + l) / 2); node.m = m; ms(f, m, d + 1); ms(m + 1, l, d + 1);
      const L = a.slice(f, m + 1), R = a.slice(m + 1, l + 1), out = []; let i = 0, j = 0;
      while (i < L.length || j < R.length) out.push(j >= R.length || (i < L.length && L[i] <= R[j]) ? L[i++] : R[j++]);
      out.forEach((v, k) => a[f + k] = v); node.after = out; }
    else node.after = node.before.slice();
  };
  ms(0, a.length - 1, 0);
  return { calls, sorted: a };
};

/** sort passes in exam-table form.
 *  alg: bubble (basic: n−1 passes, compares 0..n−pass−1), ibubble (stops after a pass with no swap),
 *  bubbleFixed (variant: every pass compares x = 0..n−2),
 *  selection (largest → index last, swaps every pass even with itself),
 *  iselection (improved: no swap when largest already at last),
 *  selmin (variant: minIndex → front, swaps every pass),
 *  insertion / insertionDesc.
 *  Returns [{pass, a, cmp, swp}] */
T1.passes = (arr, alg) => {
  const a = arr.slice(), n = a.length, out = [];
  const sw = (i, j) => { const t = a[i]; a[i] = a[j]; a[j] = t; };
  if (alg === 'bubble' || alg === 'ibubble' || alg === 'bubbleFixed') {
    for (let p = 1; p <= n - 1; p++) {
      let cmp = 0, swp = 0; const end = alg === 'bubbleFixed' ? n - 1 : n - p;
      for (let x = 0; x < end; x++) { cmp++; if (a[x] > a[x + 1]) { sw(x, x + 1); swp++; } }
      out.push({ pass: p, a: a.slice(), cmp, swp });
      if (alg === 'ibubble' && swp === 0) break;
    }
  } else if (alg === 'selection' || alg === 'iselection') {
    for (let last = n - 1, p = 1; last >= 1; last--, p++) {
      let li = 0, cmp = 0;
      for (let q = 1; q <= last; q++) { cmp++; if (a[q] > a[li]) li = q; }
      let swp = 0;
      if (alg === 'selection' || li !== last) { sw(li, last); swp = 1; }
      out.push({ pass: p, a: a.slice(), cmp, swp, li, last });
    }
  } else if (alg === 'selmin') {
    for (let i = 0; i < n - 1; i++) {
      let mi = i, cmp = 0;
      for (let j = i + 1; j < n; j++) { cmp++; if (a[j] < a[mi]) mi = j; }
      sw(i, mi); out.push({ pass: i + 1, a: a.slice(), cmp, swp: 1, mi });
    }
  } else if (alg === 'insertion' || alg === 'insertionDesc') {
    const before = alg === 'insertion' ? (x, y) => x > y : (x, y) => x < y;
    for (let k = 1; k < n; k++) {
      const v = a[k]; let j = k, cmp = 0, shift = 0;
      while (j > 0) { cmp++; if (before(a[j - 1], v)) { a[j] = a[j - 1]; j--; shift++; } else break; }
      a[j] = v; out.push({ pass: k, a: a.slice(), cmp, swp: shift });
    }
  }
  return out;
};

/** bubble trace table: pass 1..n−1, x 0..n−2 (no shrinking), one row per comparison */
T1.bubbleRows = (arr) => {
  const a = arr.slice(), n = a.length, rows = [];
  for (let p = 1; p < n; p++) for (let x = 0; x < n - 1; x++) {
    const l = a[x], r = a[x + 1], gt = l > r;
    if (gt) { a[x] = r; a[x + 1] = l; }
    rows.push({ p, x, l, r, gt, a: a.slice() });
  }
  return rows;
};

/** small recursive functions for tracing drills: each returns the list of frames [{args, next, ret}] */
T1.REC = {
  addDown: { sig: 'int addDown(int x, int y)', code: ['if (x == 0)', '    return y;', 'else', '    return addDown(x - 1, x + y);'],
        step: ([x, y]) => x === 0 ? { base: y } : { next: [x - 1, x + y] } },
  sum: { sig: 'int sum(int n)', code: ['if (n == 0)', '    return 0;', 'else', '    return n + sum(n / 10);'],
         step: ([n]) => n === 0 ? { base: 0 } : { next: [Math.trunc(n / 10)], comb: r => n + r } },
  meet: { sig: 'int meet(int x, int y)', code: ['if (x < y)', '    return meet(x + 1, y - 1);', 'else', '    return x + y;'],
              step: ([x, y]) => x < y ? { next: [x + 1, y - 1] } : { base: x + y } },
  power: { sig: 'int power(int x, int y)', code: ['if (y != 0)', '    return x * power(x, y - 1);', 'else', '    return 1;'],
                step: ([x, y]) => y !== 0 ? { next: [x, y - 1], comb: r => x * r } : { base: 1 } },
  fact: { sig: 'int fact(int x)', code: ['if (x == 1)', '    return 1;', 'else', '    return x * fact(x - 1);'],
        step: ([x]) => x === 1 ? { base: 1 } : { next: [x - 1], comb: r => x * r } },
  triple: { sig: 'int triple(int d)', code: ['if (d == 0)', '    return 1;', 'else', '    return 3 * triple(d - 2);'],
             step: ([d]) => d === 0 ? { base: 1 } : { next: [d - 2], comb: r => 3 * r } },
  digits: { sig: 'int digits(int n)', code: ['if (n < 10)', '    return n;', 'else', '    return n % 10 + digits(n / 10);'],
            step: ([n]) => n < 10 ? { base: n } : { next: [Math.trunc(n / 10)], comb: r => n % 10 + r } }
};
T1.recFrames = (fn, args) => {
  const F = T1.REC[fn], frames = []; let cur = args;
  for (let k = 0; k < 40; k++) {
    const s = F.step(cur); frames.push({ args: cur, ...s });
    if ('base' in s) break; cur = s.next;
  }
  if (!('base' in frames[frames.length - 1])) throw new Error('no base case reached');
  for (let i = frames.length - 1; i >= 0; i--) { const f = frames[i]; f.ret = 'base' in f ? f.base : (f.comb ? f.comb(frames[i + 1].ret) : frames[i + 1].ret); }
  return frames;
};

/** print-order functions (head vs tail recursion) — return the printed text */
T1.PRINT = {
  after: { code: n => `void func(int n) {\n    if (n > 0) {\n        func(n - 1);\n        cout << n << " ";\n    }\n}`, run: n => { const o = []; const f = k => { if (k > 0) { f(k - 1); o.push(k); } }; f(n); return o.join(' '); } },
  before: { code: n => `void func(int n) {\n    if (n > 0) {\n        cout << n << " ";\n        func(n - 1);\n    }\n}`, run: n => { const o = []; const f = k => { if (k > 0) { o.push(k); f(k - 1); } }; f(n); return o.join(' '); } },
  count: { code: n => `void count(int n) {\n    if (n > 0) count(n - 1);\n    cout << n << " ";\n}`, run: n => { const o = []; const f = k => { if (k > 0) f(k - 1); o.push(k); }; f(n); return o.join(' '); } },
};

/** step-count expression evaluator: accepts things like "2(n-1) + 3(n-1)log4n", "n²+2n", "1+3(1+log₂n)" */
T1.evalExpr = (s, n) => {
  let e = String(s).toLowerCase().replace(/\s+/g, '')
    .replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/²/g, '^2').replace(/³/g, '^3')
    .replace(/₂/g, '2').replace(/₃/g, '3').replace(/₄/g, '4').replace(/lg/g, 'log2');
  if (!/^[0-9n+\-*/^().logq]*$/.test(e)) return NaN;
  e = e.replace(/log(\d)\(n\)/g, 'L$1').replace(/log(\d)n/g, 'L$1').replace(/log\(n\)/g, 'L2').replace(/logn/g, 'L2');   // log2n → L2
  // tokens: numbers, n, L<base>, operators, parentheses
  const toks = e.match(/\d+(\.\d+)?|n|L\d|[+\-*/^()]/g); if (!toks || toks.join('') !== e) return NaN;
  const out = [];
  const val = t => /^(\d|n|L)/.test(t);
  toks.forEach((t, i) => {   // implicit multiplication: 2n, 3(n-1), n log2n, (n-1)(n+1)
    const prev = toks[i - 1];
    if (i && (val(prev) || prev === ')') && (val(t) || t === '(')) out.push('*');
    out.push(t);
  });
  const js = out.join('').replace(/L(\d)/g, (m, b) => `(Math.log(n)/Math.log(${b}))`).replace(/\^/g, '**');
  try { const v = Function('n', `return ${js};`)(n); return typeof v === 'number' ? v : NaN; } catch (err) { return NaN; }
};
T1.sameExpr = (a, b) => [16, 64, 256, 4096].every(n => { const x = T1.evalExpr(a, n), y = T1.evalExpr(b, n); return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-6 * Math.max(1, Math.abs(y)); });

if (typeof module !== 'undefined') module.exports = T1;

</script>
<script>
/* ===== ../../addons/cs-algorithms/sortviz.js ===== */
/* =====================================================================
   ===== Sorting visualizer: step generators that follow the listings below line by line
   ===================================================================== */
const SORT_CODE = {
bubble: `void BubbleSort(int data[], int listSize)
{  int pass, hold;
   for (pass = 1; pass < listSize; pass++)
   {  // each pass pushes the biggest remaining value to the back
      for (int x = 0; x < listSize - pass; x++)
      {  // look at one pair of neighbours
         if (data[x] > data[x+1])
         {  // wrong order -> exchange them
            hold = data[x];
            data[x] = data[x+1];
            data[x+1] = hold;
         }
      }
   }
}`,
ibubble: `void BubbleSort(int data[], int n)
{  int hold;
   bool sorted = false;            // becomes true after a pass with no exchange
   for (int pass = 1; (pass < n) && !sorted; ++pass)
   {  sorted = true;               // optimistic until an exchange happens
      for (int x = 0; x < n - pass; ++x)
      {  if (data[x] > data[x+1])
         {  hold = data[x];        // exchange the pair
            data[x] = data[x+1];
            data[x+1] = hold;
            sorted = false;        // an exchange: we need another pass
         }
      }
   }
}`,
selection: `void SelectionSort(int Data[], int n)
{
   for (int last = n - 1; last >= 1; --last)
   {  // find the biggest value in Data[0..last]
      int largestIndex = 0;        // start by guessing index 0
      for (int p = 1; p <= last; ++p)
      {
         if (Data[p] > Data[largestIndex])
            largestIndex = p;
      }
      swap(Data[largestIndex], Data[last]);   // park it at the back
   }
}`,
insertion: `void InsertionSort(int data[], int n)
{  int item;
   int pass, insertIndex;
   for (pass = 1; pass < n; pass++)
   {
      item = data[pass];           // next value to place
      insertIndex = pass;
      while ((insertIndex > 0) && (data[insertIndex-1] > item))
      {  // bigger neighbour on the left: move it one step right
         data[insertIndex] = data[insertIndex-1];
         insertIndex--;
      }
      data[insertIndex] = item;    // drop the item into the gap
   }
}`,
merge: `void mergeSort(int theArray[], int first, int last)
{
   if (first < last)
   {
      int mid = (first + last) / 2;        // split point
      mergeSort(theArray, first, mid);     // left part
      mergeSort(theArray, mid + 1, last);  // right part
      merge(theArray, first, mid, last);   // combine both sorted parts
   }
}
void merge(int theArray[], int first, int mid, int last)
{
   int tempArray[MAX_SIZE];
   int first1 = first, last1 = mid, first2 = mid + 1, last2 = last;
   int index = first1;
   for (; (first1 <= last1) && (first2 <= last2); ++index)
      if (theArray[first1] < theArray[first2])
         tempArray[index] = theArray[first1++];
      else
         tempArray[index] = theArray[first2++];
   for (; first1 <= last1; ++first1, ++index)    // copy what is left on the left
      tempArray[index] = theArray[first1];
   for (; first2 <= last2; ++first2, ++index)    // copy what is left on the right
      tempArray[index] = theArray[first2];
   for (index = first; index <= last; ++index)   // write the result back
      theArray[index] = tempArray[index];
}`,
quick: `void quickSort(int T[], int first, int last)
{
   int cut;
   if (first < last)
   {
      cut = partition(T, first, last);
      quickSort(T, first, cut);
      quickSort(T, cut + 1, last);
   }
}
int partition(int T[], int first, int last)
{
   int pivot = T[first];               // first value is the pivot
   int bottom = first, top = last;
   bool going = true;  int cutPoint, temp;
   while (going)
   {
      while (T[top] > pivot)    top--;      // top walks left past bigger values
      while (T[bottom] < pivot) bottom++;   // bottom walks right past smaller values
      if (bottom < top)
      {  temp = T[bottom]; T[bottom] = T[top]; T[top] = temp;  }
      else
      {  going = false; cutPoint = top;  }
   }
   return cutPoint;
}`
};
const ALG_NAME = { bubble: 'Bubble sort', ibubble: 'Improved bubble sort', selection: 'Selection sort', insertion: 'Insertion sort', merge: 'Merge sort', quick: 'Quick sort' };
const ALG_ZH = { bubble: '冒泡排序', ibubble: '改进冒泡排序', selection: '选择排序', insertion: '插入排序', merge: '归并排序', quick: '快速排序' };

function sortRun(alg, input) {
  const a = input.slice(), n = a.length, st = [], log = [], c = { cmp: 0, swp: 0, shf: 0 };
  let done = [], err = null;
  const push = o => { if (st.length > 6000) throw new Error('too many steps'); st.push(Object.assign({ a: a.slice(), done: done.slice(), c: Object.assign({}, c) }, o)); };
  const L = (en, zh) => [en, zh];
  const sw = (i, j) => { const t = a[i]; a[i] = a[j]; a[j] = t; };
  const range = (lo, hi) => { const r = []; for (let i = lo; i <= hi; i++) r.push(i); return r; };
  try {
  push({ line: [], msg: L('Start — unsorted list', '开始——未排序列表') });
  if (alg === 'bubble' || alg === 'ibubble') {
    const imp = alg === 'ibubble'; const lc = imp ? 7 : 7, ls = imp ? [8, 9, 10, 11] : [9, 10, 11], lp = imp ? 4 : 3;
    let sorted = false;
    for (let pass = 1; pass < n && !sorted; pass++) {
      if (imp) sorted = true; let swaps = 0;
      push({ line: [lp], msg: L(`Pass ${pass}: compare adjacent pairs from index 0 to ${n - pass - 1}`, `第 ${pass} 趟：比较下标 0 到 ${n - pass - 1} 的相邻对`) });
      for (let x = 0; x < n - pass; x++) {
        c.cmp++; push({ cmp: [x, x + 1], line: [lc], msg: L(`Compare data[${x}]=${a[x]} and data[${x + 1}]=${a[x + 1]}${a[x] > a[x + 1] ? ' → out of order' : ' → OK, no swap'}`, `比较 data[${x}]=${a[x]} 与 data[${x + 1}]=${a[x + 1]}${a[x] > a[x + 1] ? ' → 顺序反了' : ' → 没问题，不交换'}`) });
        if (a[x] > a[x + 1]) { sw(x, x + 1); c.swp++; swaps++; if (imp) sorted = false; push({ swp: [x, x + 1], line: ls, msg: L(`Swap → ${a[x]}, ${a[x + 1]}`, `交换 → ${a[x]}, ${a[x + 1]}`) }); }
      }
      done = range(n - pass, n - 1);
      log.push({ k: st.length, label: L(`After pass ${pass}`, `第 ${pass} 趟后`), a: a.slice(), note: L(`${n - pass} comparisons, ${swaps} swaps${imp && sorted ? ' → no swap, list is sorted, STOP' : ''}`, `${n - pass} 次比较，${swaps} 次交换${imp && sorted ? ' → 没有交换，已排好，停止' : ''}`) });
      push({ line: [lp], msg: L(`End of pass ${pass}: ${a[n - pass]} is in its final position${imp && sorted ? '. No swaps in this pass → sorted = true → stop early!' : ''}`, `第 ${pass} 趟结束：${a[n - pass]} 已在最终位置${imp && sorted ? '。本趟没有交换 → sorted = true → 提前结束！' : ''}`) });
    }
    done = range(0, n - 1);
  } else if (alg === 'selection') {
    for (let last = n - 1; last >= 1; last--) {
      let li = 0; push({ ptr: { last, largest: li }, line: [5], msg: L(`last = ${last}: assume largest is at index 0 (${a[0]})`, `last = ${last}：先假设最大值在下标 0（${a[0]}）`) });
      for (let p = 1; p <= last; p++) {
        c.cmp++; push({ cmp: [p, li], ptr: { last, largest: li }, line: [8], msg: L(`Compare Data[${p}]=${a[p]} > Data[largestIndex=${li}]=${a[li]}?`, `比较 Data[${p}]=${a[p]} > Data[largestIndex=${li}]=${a[li]}？`) });
        if (a[p] > a[li]) { li = p; push({ ptr: { last, largest: li }, line: [9], msg: L(`Yes → largestIndex = ${p}`, `是 → largestIndex = ${p}`) }); }
      }
      sw(li, last); c.swp++;
      push({ swp: [li, last], ptr: { last, largest: li }, line: [11], msg: li === last ? L(`swap(Data[${li}], Data[${last}]) — same position! This basic version swaps anyway (a wasted swap).`, `swap(Data[${li}], Data[${last}])——同一位置！基础版照样交换（白交换）。`) : L(`Swap largest ${a[last]} into position ${last}`, `把最大值 ${a[last]} 换到位置 ${last}`) });
      done = range(last, n - 1);
      log.push({ k: st.length, label: L(`After pass ${n - last} (last = ${last})`, `第 ${n - last} 趟后（last = ${last}）`), a: a.slice(), note: L(`${last} comparisons, largestIndex = ${li}`, `${last} 次比较，largestIndex = ${li}`) });
    }
    done = range(0, n - 1);
  } else if (alg === 'insertion') {
    for (let pass = 1; pass < n; pass++) {
      const item = a[pass]; let ii = pass, cmps = 0;
      done = range(0, pass - 1);
      push({ ptr: { item: pass }, line: [6, 7], msg: L(`Pass ${pass}: item = data[${pass}] = ${item}; sorted region is [0..${pass - 1}]`, `第 ${pass} 趟：item = data[${pass}] = ${item}；已排序区为 [0..${pass - 1}]`), item });
      while (ii > 0) {
        c.cmp++; cmps++;
        push({ cmp: [ii - 1, ii], line: [8], msg: L(`Compare data[${ii - 1}]=${a[ii - 1]} > item ${item}?${a[ii - 1] > item ? ' Yes' : ' No → stop'}`, `比较 data[${ii - 1}]=${a[ii - 1]} > item ${item}？${a[ii - 1] > item ? ' 是' : ' 否 → 停'}`), item });
        if (a[ii - 1] > item) { a[ii] = a[ii - 1]; c.shf++; ii--; push({ swp: [ii, ii + 1], line: [10, 11], msg: L(`Shift ${a[ii + 1]} right to index ${ii + 1}`, `把 ${a[ii + 1]} 右移到下标 ${ii + 1}`), item, hole: ii }); }
        else break;
      }
      a[ii] = item; done = range(0, pass);
      push({ line: [13], msg: L(`Insert ${item} at index ${ii}`, `把 ${item} 插到下标 ${ii}`), ins: ii });
      log.push({ k: st.length, label: L(`After pass ${pass}`, `第 ${pass} 趟后`), a: a.slice(), note: L(`inserted ${item}; ${cmps} comparison(s)`, `插入 ${item}；${cmps} 次比较`) });
    }
    done = range(0, n - 1);
  } else if (alg === 'merge') {
    const ms = (f, l) => {
      push({ range: [f, l], line: [3], msg: L(`mergeSort(theArray, ${f}, ${l})${f < l ? '' : ' — one item, nothing to do'}`, `mergeSort(theArray, ${f}, ${l})${f < l ? '' : '——只有一项，什么都不做'}`) });
      if (f < l) {
        const mid = Math.floor((f + l) / 2);
        push({ range: [f, l], split: mid, line: [5], msg: L(`mid = (${f} + ${l}) / 2 = ${mid} → left [${f}..${mid}], right [${mid + 1}..${l}]`, `mid = (${f} + ${l}) / 2 = ${mid} → 左 [${f}..${mid}]，右 [${mid + 1}..${l}]`) });
        ms(f, mid); ms(mid + 1, l);
        const tmp = []; let i = f, j = mid + 1;
        while (i <= mid && j <= l) {
          c.cmp++; push({ range: [f, l], split: mid, cmp: [i, j], tmp: tmp.slice(), tf: f, line: [17], msg: L(`merge: ${a[i]} < ${a[j]}? → take ${a[i] < a[j] ? a[i] : a[j]}`, `合并：${a[i]} < ${a[j]}？→ 取 ${a[i] < a[j] ? a[i] : a[j]}`) });
          tmp.push(a[i] < a[j] ? a[i++] : a[j++]);
        }
        while (i <= mid) tmp.push(a[i++]); while (j <= l) tmp.push(a[j++]);
        push({ range: [f, l], split: mid, tmp: tmp.slice(), tf: f, line: [21, 22, 23, 24], msg: L('Copy the remaining items into tempArray', '把剩余项复制进 tempArray') });
        for (let k = 0; k < tmp.length; k++) a[f + k] = tmp[k];
        push({ range: [f, l], line: [25, 26], msg: L(`Copy tempArray back → [${f}..${l}] is now sorted`, `把 tempArray 复制回原数组 → [${f}..${l}] 已有序`) });
        log.push({ k: st.length, label: L(`merge(${f}, ${mid}, ${l})`, `merge(${f}, ${mid}, ${l})`), a: a.slice(), hl: [f, l], note: L(`[${a.slice(f, mid + 1 - 0).length ? '' : ''}${tmp.join(' ')}]`, `[${tmp.join(' ')}]`) });
      }
    };
    ms(0, n - 1); done = range(0, n - 1);
  } else if (alg === 'quick') {
    let calls = 0;
    const part = (f, l) => {
      const pivot = a[f]; let b = f, t = l;
      push({ range: [f, l], ptr: { pivot: f, bottom: b, top: t }, line: [13, 14], msg: L(`partition(T, ${f}, ${l}): pivot = T[${f}] = ${pivot}, bottom = ${f}, top = ${l}`, `partition(T, ${f}, ${l})：pivot = T[${f}] = ${pivot}，bottom = ${f}，top = ${l}`), pivot });
      for (let guard = 0; guard < 500; guard++) {
        while (true) { c.cmp++; const g = a[t] > pivot; push({ range: [f, l], ptr: { bottom: b, top: t }, cmp: [t], line: [18], msg: L(`T[top=${t}] = ${a[t]} > ${pivot}?${g ? ' Yes → top--' : ' No → stop top here'}`, `T[top=${t}] = ${a[t]} > ${pivot}？${g ? ' 是 → top--' : ' 否 → top 停在这里'}`), pivot }); if (g) t--; else break; if (t < f) throw new Error('top ran out of range'); }
        while (true) { c.cmp++; const g = a[b] < pivot; push({ range: [f, l], ptr: { bottom: b, top: t }, cmp: [b], line: [19], msg: L(`T[bottom=${b}] = ${a[b]} < ${pivot}?${g ? ' Yes → bottom++' : ' No → stop bottom here'}`, `T[bottom=${b}] = ${a[b]} < ${pivot}？${g ? ' 是 → bottom++' : ' 否 → bottom 停在这里'}`), pivot }); if (g) b++; else break; if (b > l) throw new Error('bottom ran out of range'); }
        if (b < t) {
          if (a[b] === a[t]) throw new Error('DUP');
          sw(b, t); c.swp++; push({ range: [f, l], ptr: { bottom: b, top: t }, swp: [b, t], line: [20, 21], msg: L(`bottom ${b} < top ${t} → swap T[${b}] and T[${t}]`, `bottom ${b} < top ${t} → 交换 T[${b}] 与 T[${t}]`), pivot });
        } else {
          push({ range: [f, l], ptr: { bottom: b, top: t }, line: [23, 25], msg: L(`bottom ${b} ≥ top ${t} → stop, cutPoint = top = ${t}`, `bottom ${b} ≥ top ${t} → 结束，cutPoint = top = ${t}`), pivot, cut: t });
          log.push({ k: st.length, label: L(`partition(T, ${f}, ${l})`, `partition(T, ${f}, ${l})`), a: a.slice(), hl: [f, l], note: L(`pivot ${pivot} → returns cut = ${t}; next: quickSort(T, ${f}, ${t}) and quickSort(T, ${t + 1}, ${l})`, `pivot ${pivot} → 返回 cut = ${t}；接着 quickSort(T, ${f}, ${t}) 和 quickSort(T, ${t + 1}, ${l})`), cut: t });
          return t;
        }
      }
      throw new Error('partition loop');
    };
    const qs = (f, l) => {
      if (++calls > 400) throw new Error('recursion');
      push({ range: [f, l], line: [4], msg: L(`quickSort(T, ${f}, ${l})${f < l ? '' : ' — first ≥ last, nothing to do'}`, `quickSort(T, ${f}, ${l})${f < l ? '' : '——first ≥ last，什么都不做'}`) });
      if (f < l) { const cut = part(f, l); qs(f, cut); qs(cut + 1, l); }
    };
    qs(0, n - 1); done = range(0, n - 1);
  }
  push({ line: [], msg: L('Done — the list is sorted', '完成——列表已排好') });
  } catch (e) { err = e.message; }
  return { st, log, c, a, err };
}

SITE.widgets.sortViz = (el, arg) => {
  let alg = arg.alg, arr = (arg.arr || [7, 8, 3, 1, 6]).slice();
  const algs = arg.algs || Object.keys(ALG_NAME);
  const presets = arg.presets || [];
  const build = () => {
    el.innerHTML = `<div class="w"><div class="wt">${T('Sorting visualizer — runs the code line by line', '排序可视化——逐行运行代码')}</div>
    <div class="row"><select class="in al">${algs.map(k => `<option value="${k}" ${k === alg ? 'selected' : ''}>${ALG_NAME[k]} / ${ALG_ZH[k]}</option>`).join('')}</select>
    <input class="in mono ar" value="${arr.join(' ')}" style="flex:1;min-width:180px"><button class="btn sm pri go">${T('Load', '载入')}</button><button class="btn sm rnd">🎲 ${T('Random', '随机')}</button></div>
    ${presets.length ? `<div class="row" style="font-size:13px">${T('Examples', '例子')}: ${presets.map(p => `<button class="btn sm ps" data-p="${p.join(' ')}">[${p.join(' ')}]</button>`).join('')}</div>` : ''}
    <div class="vz"></div></div>`;
    $('.al', el).onchange = e => { alg = e.target.value; run(); };
    $('.go', el).onclick = () => { const v = $('.ar', el).value.trim().split(/[\s,]+/).map(Number).filter(x => !isNaN(x)); if (v.length >= 2 && v.length <= 14) { arr = v; run(); } };
    $('.rnd', el).onclick = () => { arr = distinctInts(rint(5, 8), 1, 99); $('.ar', el).value = arr.join(' '); run(); };
    $$('.ps', el).forEach(b => b.onclick = () => { arr = b.dataset.p.split(' ').map(Number); $('.ar', el).value = arr.join(' '); run(); });
    run();
  };
  const run = () => {
    const R = sortRun(alg, arr); const vz = $('.vz', el);
    if (R.err) {
      vz.innerHTML = R.err === 'DUP' ? `<div class="warn">${T('This <code>partition()</code> loops forever on this input: two values equal to the pivot meet (bottom and top both stop on equal values and swapping them changes nothing). Use distinct numbers here.', '这个 <code>partition()</code> 遇到这个输入会死循环：两个等于 pivot 的值相遇（bottom 和 top 都停在相等的值上，交换也没变化）。请用不重复的数。')}</div>`
        : `<div class="warn">${T('This input cannot be visualized (' + esc(R.err) + '). Try distinct numbers.', '无法可视化这个输入（' + esc(R.err) + '）。请用互不相同的数。')}</div>`;
      return;
    }
    vz.innerHTML = `<div class="vzgrid"><div style="min-width:0"><div class="stage" style="overflow-x:auto;padding:6px 0"></div><div class="msg m" style="min-height:3em"></div>
      <div class="row cnt" style="font-size:14px"></div><div class="ctl"></div></div><div style="min-width:0">${codeHTML(SORT_CODE[alg])}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn pri pstart">🧠 ${T('Test me: predict every step for this array', '考考我：预测这个数组的每一步')}</button></div><div class="pred"></div>
      <div class="plogw"><b>${T('Pass log (what the exam asks you to write)', '每趟结果（考试要你写的就是这个）')}</b><div class="plog"></div></div>`;
    const pre = $('pre', vz);
    const draw = (s, i) => {
      const n = s.a.length, ptrs = s.ptr || {};
      const inRange = k => !s.range || (k >= s.range[0] && k <= s.range[1]);
      let h = `<div style="display:flex;gap:5px;align-items:flex-end">`;
      for (let k = 0; k < n; k++) {
        let cls = 'box';
        if (s.done.includes(k)) cls += ' g';
        if (s.cmp && s.cmp.includes(k)) cls += ' b';
        if (s.swp && s.swp.includes(k)) cls += ' a';
        if (s.ins === k) cls += ' a';
        if (!inRange(k)) cls += ' dim';
        const labels = Object.entries(ptrs).filter(([, v]) => v === k).map(([kk]) => kk);
        const sep = s.split === k ? 'margin-right:14px;' : '';
        h += `<div style="text-align:center;${sep}"><div class="${cls}" style="min-width:42px">${s.hole === k && s.item !== undefined ? '<span style="opacity:.4">' + s.a[k] + '</span>' : s.a[k]}</div><div style="font-size:11px;color:var(--muted)">[${k}]</div><div style="font-size:11px;font-weight:700;color:var(--accent);min-height:14px">${labels.join('<br>')}</div></div>`;
      }
      h += `</div>`;
      if (s.tmp) h += `<div style="margin-top:6px;font-size:12px;color:var(--muted)">tempArray</div><div style="display:flex;gap:5px">${Array.from({ length: n }, (_, k) => { const v = k >= s.tf && k - s.tf < s.tmp.length ? s.tmp[k - s.tf] : null; return `<div class="box ${v === null ? 'dim' : 'b'}" style="min-width:42px;height:32px">${v === null ? '' : v}</div>`; }).join('')}</div>`;
      if (s.item !== undefined) h += `<div style="margin-top:6px;font-size:14px">item = <b style="font-family:var(--mono)">${s.item}</b></div>`;
      if (s.pivot !== undefined) h += `<div style="margin-top:6px;font-size:14px">pivot = <b style="font-family:var(--mono)">${s.pivot}</b></div>`;
      $('.stage', vz).innerHTML = h;
      $('.m', vz).innerHTML = T(s.msg[0], s.msg[1]);
      $('.cnt', vz).innerHTML = `${T('Comparisons', '比较')}: <b>${s.c.cmp}</b> · ${alg === 'insertion' ? T('Shifts', '移位') + ': <b>' + s.c.shf + '</b>' : alg === 'merge' ? '' : T('Swaps', '交换') + ': <b>' + s.c.swp + '</b>'}`;
      highlightLines(pre, s.line || []);
      $('.plog', vz).innerHTML = `<table class="t" style="font-size:14px">` + R.log.map(L => `<tr style="${L.k > i ? 'opacity:.25' : ''}"><td style="white-space:nowrap">${T(L.label[0], L.label[1])}</td><td style="font-family:var(--mono);white-space:nowrap">${L.a.map((v, k) => L.hl && (k < L.hl[0] || k > L.hl[1]) ? `<span style="color:var(--muted)">${v}</span>` : `<b>${v}</b>`).join(' ')}</td><td style="font-size:13px">${T(L.note[0], L.note[1])}</td></tr>`).join('') + `</table>`;
    };
    stepPlayer($('.ctl', vz), R.st, draw, { speed: 650 });
    const pred = $('.pred', vz), plogw = $('.plogw', vz);
    $('.pstart', vz).onclick = () => {
      let k = 0, score = 0; const res = [];
      plogw.style.display = 'none'; $('.pstart', vz).style.display = 'none';
      const norm = t => t.trim().split(/[\s,]+/).filter(Boolean).map(Number);
      const show = () => {
        const n = R.log.length;
        let h = `<div class="card" style="border-color:var(--blue)"><b>🧠 ${T('Predict every step', '预测每一步')}</b> <span style="font-size:13px;color:var(--muted)">${T('Write the whole array after each step, numbers separated by spaces. The pass log is hidden until you finish — don’t play the animation above.', '写出每一步之后的整个数组，数字用空格隔开。做完之前每趟结果是隐藏的——别去播放上面的动画。')}</span>
          <div style="font-family:var(--mono);margin:6px 0">${T('Start', '初始')}: [${arr.join(' ')}]</div><table class="t" style="font-size:14px">`;
        R.log.forEach((L, i) => { if (i < k) h += `<tr><td style="white-space:nowrap">${T(L.label[0], L.label[1])}</td><td style="font-family:var(--mono)">${res[i]}</td></tr>`; });
        if (k < n) h += `<tr><td style="white-space:nowrap">${T(R.log[k].label[0], R.log[k].label[1])}</td><td><input class="in mono pin" style="width:100%" placeholder="${arr.join(' ')}"></td></tr>`;
        h += `</table>`;
        h += k < n ? `<div class="row"><button class="btn sm pri pck">${T('Check', '检查')}</button><button class="btn sm pq">${T('Stop', '停止')}</button></div>`
          : `<div class="${score === n ? 'tip' : 'exam'}"><b>${T(`Score: ${score} / ${n}`, `得分：${score} / ${n}`)}</b> ${score === n ? T('— exam-ready for this algorithm.', '——这个算法可以上考场了。') : T('— step through the red ones in the visualizer above, then press 🎲 Random and try again.', '——在上面的可视化器里把红色的步骤走一遍，然后按 🎲 随机再试一次。')} <button class="btn sm pq">${T('Close', '关闭')}</button></div>`;
        h += `</div>`;
        pred.innerHTML = h;
        const pin = $('.pin', pred); if (pin) { pin.focus(); pin.onkeydown = e => { if (e.key === 'Enter') $('.pck', pred).click(); }; }
        const ck = $('.pck', pred); if (ck) ck.onclick = () => {
          const got = norm(pin.value), want = R.log[k].a; if (!got.length) return;
          const ok = got.length === want.length && got.every((v, j) => v === want[j]);
          if (ok) score++;
          res[k] = ok ? `<span class="tag-ok">✓ ${want.join(' ')}</span>` : `<span class="tag-no">✗ ${esc(pin.value.trim())}</span><br>${T('correct', '正确')}: <b>${want.join(' ')}</b>`;
          k++; show(); };
        $$('.pq', pred).forEach(b => b.onclick = () => { pred.innerHTML = ''; plogw.style.display = ''; $('.pstart', vz).style.display = ''; });
      };
      show();
    };
  };
  build();
};

/* helpers for quiz generators */
const fmtArr = a => a.join(' ');
/** random "array after pass k" fill-in question for bubble / selection (largest → end) / insertion */
function passDrill(alg) {
  const n = rint(5, 6), arr = distinctInts(n, 1, 60); const R = sortRun(alg, arr); const k = rint(1, Math.min(3, R.log.length));
  const nm = { bubble: ['bubble sort', '冒泡排序'], selection: ['selection sort (largest to the end)', '选择排序（最大值放到末尾）'], insertion: ['insertion sort', '插入排序'] }[alg];
  return { t: 'fill', q: [`Sort <code>[${fmtArr(arr)}]</code> into ascending order with <b>${nm[0]}</b>. Write the array <b>after pass ${k}</b>.`, `用<b>${nm[1]}</b>把 <code>[${fmtArr(arr)}]</code> 升序排列。写出<b>第 ${k} 趟后</b>的数组。`], a: [fmtArr(R.log[k - 1].a)], ph: 'e.g. 3 7 1 6 8',
    e: [R.log.slice(0, k).map((L, i) => `Pass ${i + 1}: ${fmtArr(L.a)}`).join('<br>'), R.log.slice(0, k).map((L, i) => `第 ${i + 1} 趟：${fmtArr(L.a)}`).join('<br>')] };
}

(function () {

const t1norm = v => String(v == null ? '' : v).toLowerCase().replace(/[{}\[\]]/g, ' ').replace(/[,;]/g, ' ').replace(/\s+/g, ' ').trim();
const t1arrEq = (got, exp) => t1norm(got).split(' ').filter(x => x !== '-' && x !== '–').join(' ') === t1norm(exp).split(' ').filter(x => x !== '-').join(' ');
const t1fmt = a => a.join(' ');
const t1cmpVal = (got, exp) => {           // '-' / 'none' / empty-ish for an exhausted half
  if (exp === '-') return ['-', '–', 'none', 'x', 'null', '/'].includes(t1norm(got));
  return t1norm(got) === t1norm(exp);
};
const t1in = (k, cls = '', ph = '') => `<input class="t1i ${cls}" data-k="${k}" placeholder="${ph}" autocomplete="off" spellcheck="false">`;
const t1sel = (k, opts) => `<select class="t1i" data-k="${k}"><option value="">?</option>${opts.map(o => `<option value="${attr(o[0])}">${o[1]}</option>`).join('')}</select>`;

/** generic answer-sheet form.
 *  spec: { title, intro, body (html with t1in/t1sel keys), exp: {key: expected | {v, cmp}}, model (html shown with the answer), newData (fn → redraw) } */
function t1Form(el, spec) {
  el.innerHTML = `<div class="w t1"><div class="wt">${spec.title}</div>${spec.intro || ''}<div class="t1body">${spec.body}</div>
    <div class="row"><button class="btn sm pri ck">${T('Check', '检查')}</button><button class="btn sm sh">${T('Show answer', '看答案')}</button>
    <button class="btn sm cl">${T('Clear', '清空')}</button>${spec.newData ? `<button class="btn sm nw">🎲 ${T('New data', '换一组数据')}</button>` : ''}<span class="t1score">${wRecHTML('t1:' + (spec.key || String(spec.title).replace(/<[^>]+>/g, '').slice(0, 80)))}</span></div>
    <div class="t1model"></div></div>`;
  const rkey = 't1:' + (spec.key || String(spec.title).replace(/<[^>]+>/g, '').slice(0, 80));   // random sheets share one record per type
  const inputs = () => $$('[data-k]', el);
  const expOf = k => { const e = spec.exp[k]; return e && typeof e === 'object' && 'v' in e ? e : { v: e }; };
  const check = () => {
    let ok = 0, n = 0;
    inputs().forEach(i => { const e = expOf(i.dataset.k); if (e.v === undefined) return; n++;
      const good = e.cmp ? e.cmp(i.value, e.v) : t1norm(i.value) === t1norm(e.v); i.classList.toggle('ok', good); i.classList.toggle('bad', !good); if (good) ok++; });
    wRec(rkey, ok, n, spec.title);
    $('.t1score', el).innerHTML = `${ok} / ${n} ${ok === n ? '✅' : ''} ${wRecHTML(rkey)}`;
    return ok === n;
  };
  $('.ck', el).onclick = check;
  $('.sh', el).onclick = () => {
    inputs().forEach(i => { const e = expOf(i.dataset.k); if (e.v === undefined) return; i.value = e.show !== undefined ? e.show : e.v; i.classList.add('ok'); i.classList.remove('bad'); });
    $('.t1score', el).textContent = '';
    if (spec.model) $('.t1model', el).innerHTML = spec.model;
  };
  $('.cl', el).onclick = () => { inputs().forEach(i => { if (!i.dataset.keep) i.value = ''; i.classList.remove('ok', 'bad'); }); $('.t1score', el).textContent = ''; $('.t1model', el).innerHTML = ''; };
  if (spec.newData) $('.nw', el).onclick = spec.newData;
  $$('.cp', el).forEach(b => b.onclick = () => {        // "copy row above" buttons
    const from = $$(`[data-k^="${b.dataset.from}"]`, el), to = $$(`[data-k^="${b.dataset.to}"]`, el);
    to.forEach((t, i) => { if (from[i]) t.value = from[i].value; });
  });
  if (spec.after) spec.after(el);
}
const t1cells = (prefix, n, pre) => `<div class="t1cells"><div class="t1arr">${Array.from({ length: n }, (_, i) => `<span style="display:inline-flex;flex-direction:column;align-items:center"><span class="ix">[${i}]</span>${t1in(prefix + i).replace('>', pre ? ` value="${attr(pre[i])}" data-keep="1">` : '>')}</span>`).join('')}</div></div>`;
const t1arrShow = (a, hl = []) => `<div class="t1arr">${a.map((v, i) => `<span style="display:inline-flex;flex-direction:column;align-items:center"><span class="ix">[${i}]</span><span class="box ${hl.includes(i) ? 'a' : ''}" style="min-width:2.6em">${v}</span></span>`).join('')}</div>`;
const T1RANDARR = (n, lo = 1, hi = 60) => distinctInts(n, lo, hi);

/* ---------- Quick sort partition trace (exam format) ---------- */
const T1_PART_CODE = `int partition(int list[], int first, int last) {
    int pivot = list[first];        // (or a chosen pivot index)
    int bottom = first, top = last;
    while (true) {
        while (list[top] > pivot) top--;
        while (list[bottom] < pivot) bottom++;
        if (bottom < top)
            swap(list[bottom], list[top]);
        else
            return top;             // cutPoint
    }
}
void quickSort(int list[], int first, int last) {
    if (first < last) {
        int cut = partition(list, first, last);
        quickSort(list, first, cut);
        quickSort(list, cut + 1, last);
    }
}`;
SITE.widgets.sheetPartition = (el, arg = {}) => {
  let arr = arg.arr ? arg.arr.slice() : null, pi = arg.pivotIdx || 0;
  const make = () => { if (!arr || arg.random) { for (;;) { const a = T1RANDARR(rint(6, 9)); try { T1.partition(a); arr = a; break; } catch (e) { } } } };
  const draw = () => {
    make();
    const R = T1.partition(arr, 0, arr.length - 1, pi), n = arr.length, exp = {};
    let body = `<details><summary class="t1lab">${T('partition() code', 'partition() 代码')}</summary>${codeHTML(T1_PART_CODE)}</details>
      <div class="t1blk"><div class="t1row"><b>cut = partition(list, 0, ${n - 1})</b></div>
      <div class="t1row">pivot value = <b>${R.pivot}</b>${pi ? ` <span class="t1lab">(list[${pi}])</span>` : ''} · bottom = <b>0</b> · top = <b>${n - 1}</b></div>${t1arrShow(arr)}</div>`;
    R.steps.forEach((st, k) => {
      exp[`b${k}`] = String(st.bottom); exp[`t${k}`] = String(st.top);
      body += `<div class="t1blk"><div class="t1row"><span class="t1lab">${T('Step', '第')} ${k + 1}${T('', ' 步')}</span> bottom = ${t1in('b' + k)} top = ${t1in('t' + k)}`;
      if (st.swap) {
        exp[`s${k}a`] = String(st.swap[0]); exp[`s${k}b`] = String(st.swap[1]);
        body += ` swap(${t1in('s' + k + 'a')}, ${t1in('s' + k + 'b')})</div>`;
        st.a.forEach((v, i) => exp[`a${k}_${i}`] = String(v));
        body += `<div class="t1row"><span class="t1lab">${T('array after the swap', '交换后的数组')}</span>${k ? `<button class="btn sm cp" data-from="a${k - 1}_" data-to="a${k}_" title="copy">⧉ ${T('copy row above', '复制上一行')}</button>` : ''}</div>${t1cells(`a${k}_`, n, k ? null : arr)}</div>`;
      } else {
        exp.cut = String(st.cut); exp.q1a = '0'; exp.q1b = String(st.cut); exp.q2a = String(st.cut + 1); exp.q2b = String(n - 1);
        body += ` → bottom ≥ top → <b>cutPoint</b> = ${t1in('cut')}</div>
          <div class="t1row"><span class="t1lab">${T('Next recursive calls', '下一步递归调用')}</span></div>
          <div class="t1row"><code>quickSort(list, ${t1in('q1a')}, ${t1in('q1b')})</code> <code>quickSort(list, ${t1in('q2a')}, ${t1in('q2b')})</code></div></div>`;
      }
    });
    const fin = R.a;
    t1Form(el, { title: `${T('Quick sort partition trace', '快排 partition 追踪')} — ${arg.title ? T(arg.title[0], arg.title[1]) : T('exam format', '考试格式')}`,
      intro: P(`Trace <code>partition()</code> until the first cut. In every step write where <b>bottom</b> and <b>top</b> stop, the two values swapped, and the array after the swap. Steps shown here = steps needed (the exam sheet may give extra blocks — leave them empty).`,
        `追踪 <code>partition()</code> 到第一次切分。每一步写出 <b>bottom</b> 和 <b>top</b> 停在哪、交换的两个值、交换后的数组。这里给出的步数 = 实际需要的步数（答题纸可能多给几格——空着即可）。`),
      body, exp, newData: arg.fixed ? null : () => { arg.random = true; arr = null; draw(); },
      model: `<div class="note">${T('Partitioned array', '划分后的数组')}: <b>${t1fmt(fin)}</b> · cutPoint = <b>${R.cut}</b> → quickSort(list, 0, ${R.cut}) ${T('and', '和')} quickSort(list, ${R.cut + 1}, ${n - 1}).
        ${T(`Everything in [0..${R.cut}] is ≤ ${R.pivot}; everything in [${R.cut + 1}..${n - 1}] is ≥ ${R.pivot}.`, `[0..${R.cut}] 全部 ≤ ${R.pivot}；[${R.cut + 1}..${n - 1}] 全部 ≥ ${R.pivot}。`)}</div>` });
  };
  draw();
};

/* ---------- merge() trace table ---------- */
SITE.widgets.sheetMergeTable = (el, arg = {}) => {
  let list = arg.list ? arg.list.slice() : null, mid = arg.mid;
  const make = () => { if (!list || arg.random) { const k1 = rint(3, 4), k2 = rint(3, 4), v = T1RANDARR(k1 + k2, 1, 40); const L = v.slice(0, k1).sort((a, b) => a - b), R = v.slice(k1).sort((a, b) => a - b); list = L.concat(R); mid = k1 - 1; } };
  const draw = () => {
    make();
    const last = list.length - 1, rows = T1.mergeRows(list, 0, mid, last), exp = {};
    let body = `<div class="t1row">${T('first half', '前半')}: <b>${t1fmt(list.slice(0, mid + 1))}</b> &nbsp; ${T('second half', '后半')}: <b>${t1fmt(list.slice(mid + 1))}</b> &nbsp; <code>merge(list, 0, ${mid}, ${last})</code></div>
    <div class="t1cells"><table class="t"><tr><th>first1</th><th>first2</th><th>list[first1]</th><th>list[first2]</th><th>tempArray</th></tr>`;
    rows.forEach((r, k) => {
      exp[`f1_${k}`] = String(r.f1); exp[`f2_${k}`] = String(r.f2);
      exp[`v1_${k}`] = { v: r.v1 === null ? '-' : String(r.v1), cmp: t1cmpVal }; exp[`v2_${k}`] = { v: r.v2 === null ? '-' : String(r.v2), cmp: t1cmpVal };
      const shown = r.tmp.concat(Array(list.length - r.tmp.length).fill('-'));
      exp[`tp_${k}`] = { v: t1fmt(r.tmp), cmp: t1arrEq, show: '{' + shown.join(', ') + '}' };
      body += `<tr><td>${t1in('f1_' + k)}</td><td>${t1in('f2_' + k)}</td><td>${t1in('v1_' + k)}</td><td>${t1in('v2_' + k)}</td><td>${t1in('tp_' + k, 'w', '2 4 6 - - -')}</td></tr>`;
    });
    body += `</table></div>`;
    t1Form(el, { title: `${T('merge() trace table', 'merge() 追踪表')}${arg.title ? ' — ' + T(arg.title[0], arg.title[1]) : ''}`,
      intro: P('One row per item copied into <code>tempArray</code>: the two indices being compared, their values (write <b>-</b> when a half is used up), then tempArray after the copy.', '每复制一个元素到 <code>tempArray</code> 写一行：正在比较的两个下标、它们的值（某一半用完就写 <b>-</b>），然后是复制后的 tempArray。'),
      body, exp, newData: arg.fixed ? null : () => { arg.random = true; list = null; draw(); } });
  };
  draw();
};

/* ---------- merge sort recursion tree ---------- */
SITE.widgets.sheetMergeTree = (el, arg = {}) => {
  let arr = arg.arr ? arg.arr.slice() : null;
  const draw = () => {
    if (!arr || arg.random) arr = T1RANDARR(rint(5, 7), 1, 90);
    const { calls } = T1.mergeTree(arr), exp = {}, maxD = Math.max(...calls.map(c => c.d));
    let body = `<div class="t1lab">${T('Divide (top → bottom). Fill the index range of each mergeSort() call and the items it holds.', '拆分（从上到下）。填每个 mergeSort() 调用的下标范围和它包含的元素。')}</div>`;
    for (let d = 0; d <= maxD; d++) {
      body += `<div class="t1blk"><span class="t1lab">${T('Level', '第')} ${d}${T('', ' 层')}</span><div class="t1row">`;
      calls.filter(c => c.d === d).forEach(c => {
        const k = `${c.f}_${c.l}`;
        if (d === 0) body += `<code>mergeSort(a, ${c.f}, ${c.l})</code> [ ${t1fmt(c.before)} ]`;
        else { exp[`f${k}`] = String(c.f); exp[`l${k}`] = String(c.l); exp[`e${k}`] = { v: t1fmt(c.before), cmp: t1arrEq };
          body += `<span><code>mergeSort(a, ${t1in('f' + k)}, ${t1in('l' + k)})</code> ${t1in('e' + k, 'm', 'items')}</span>`; }
      });
      body += `</div></div>`;
    }
    body += `<div class="t1lab">${T('Merge (bottom → top). Fill the merged result of every merge(a, first, mid, last).', '合并（从下到上）。填每个 merge(a, first, mid, last) 合并后的结果。')}</div>`;
    for (let d = maxD; d >= 0; d--) {
      const ms = calls.filter(c => c.d === d && c.f < c.l); if (!ms.length) continue;
      body += `<div class="t1blk"><div class="t1row">`;
      ms.forEach(c => { const k = `${c.f}_${c.l}`; exp[`m${k}`] = { v: t1fmt(c.after), cmp: t1arrEq };
        body += `<span><code>merge(a, ${c.f}, ${c.m}, ${c.l})</code> → ${t1in('m' + k, d === 0 ? 'w' : 'm')}</span>`; });
      body += `</div></div>`;
    }
    t1Form(el, { title: `${T('Merge sort recursion tree', '归并排序递归树')}${arg.title ? ' — ' + T(arg.title[0], arg.title[1]) : ''}`,
      intro: P('Rule: <code>mid = (first + last) / 2</code> (integer division) and the <b>left half includes mid</b>. Single items are not split further.', '规则：<code>mid = (first + last) / 2</code>（整除），<b>左半包含 mid</b>。单个元素不再拆。'),
      body, exp, newData: arg.fixed ? null : () => { arg.random = true; draw(); } });
  };
  draw();
};

/* ---------- pass tables for simple sorts ---------- */
const T1_ALG = {
  bubble: ['Bubble sort (basic, n−1 passes)', '冒泡排序（基础版，n−1 趟）'],
  ibubble: ['Improved bubble sort (stop after a pass with no swap)', '改进冒泡（某趟无交换即停）'],
  selection: ['Selection sort (largest → end, swaps every pass)', '选择排序（最大值放末尾，每趟都交换）'],
  iselection: ['Improved selection sort (no swap if already in place)', '改进选择排序（已在位就不交换）'],
  selmin: ['Selection sort, minIndex → front variant', '选择排序，最小值放前面的版本'],
  insertion: ['Insertion sort, ascending', '插入排序，升序'],
  insertionDesc: ['Insertion sort, descending', '插入排序，降序']
};
SITE.widgets.sheetPass = (el, arg = {}) => {
  let arr = arg.arr ? arg.arr.slice() : null, alg = arg.alg || 'ibubble';
  const draw = () => {
    if (!arr || arg.random) arr = T1RANDARR(rint(5, 6), 1, 60);
    const P_ = T1.passes(arr, alg), n = arr.length, exp = {}, counts = arg.counts !== false && ['ibubble', 'iselection', 'bubble', 'selection', 'selmin'].includes(alg);
    let tc = 0, ts = 0;
    let body = `${arg.fixed ? '' : `<div class="t1row">${T('Algorithm', '算法')}: <select class="algsel in">${Object.entries(T1_ALG).map(([k, v]) => `<option value="${k}" ${k === alg ? 'selected' : ''}>${v[1]} · ${v[0]}</option>`).join('')}</select></div>`}
      <div class="t1row"><b>${T(T1_ALG[alg][0], T1_ALG[alg][1])}</b></div><div class="t1lab">${T('Initial array', '初始数组')}</div>${t1arrShow(arr)}`;
    P_.forEach((p, k) => {
      p.a.forEach((v, i) => exp[`p${k}_${i}`] = String(v));
      body += `<div class="t1blk"><div class="t1row"><b>${T('After pass', '第')} ${p.pass}${T('', ' 趟后')}</b>${k ? `<button class="btn sm cp" data-from="p${k - 1}_" data-to="p${k}_">⧉ ${T('copy row above', '复制上一行')}</button>` : ''}`;
      if (counts) { exp[`c${k}`] = String(p.cmp); exp[`s${k}`] = String(p.swp); tc += p.cmp; ts += p.swp;
        body += ` <span>${T('comparisons', '比较')} ${t1in('c' + k)}</span> <span>${T('swaps', '交换')} ${t1in('s' + k)}</span>`; }
      body += `</div>${t1cells(`p${k}_`, n)}</div>`;
    });
    if (counts) { exp.tc = String(tc); exp.ts = String(ts); body += `<div class="t1row"><b>${T('Total comparisons', '总比较次数')}</b> ${t1in('tc')} <b>${T('Total swaps', '总交换次数')}</b> ${t1in('ts')}</div>`; }
    const notes = {
      ibubble: T(`Stops after pass ${P_.length} because ${P_[P_.length - 1].swp === 0 ? 'that pass made no swap' : 'all n−1 passes are done'}.`, `在第 ${P_.length} 趟后停止，因为${P_[P_.length - 1].swp === 0 ? '这一趟没有交换' : 'n−1 趟都做完了'}。`),
      selection: T('This basic code swaps every pass, even when the largest is already at <code>last</code> (a wasted swap) → always n−1 swaps.', '基础版每趟都交换，即使最大值已在 <code>last</code>（白交换）→ 永远 n−1 次交换。'),
      iselection: T('Improved: skip the swap when <code>largestIndex == last</code> → best case (sorted data) 0 swaps, but comparisons stay n(n−1)/2.', '改进版：<code>largestIndex == last</code> 时不交换 → 最好情况（已有序）0 次交换，但比较仍是 n(n−1)/2。'),
      selmin: T('Variant: the <b>smallest</b> goes to the <b>front</b>. When a question prints code, follow the printed code.', '变体：<b>最小值</b>放到<b>前面</b>。题目印了代码就照代码做。'),
      insertion: T('Pass k inserts element [k] into the sorted left part.', '第 k 趟把 [k] 插入左边已排好的部分。'), insertionDesc: T('Descending: bigger items move left.', '降序：大的往左移。'),
      bubble: T('Basic version: always n−1 passes, pass k makes n−k comparisons.', '基础版：永远 n−1 趟，第 k 趟比较 n−k 次。') };
    t1Form(el, { title: `${T('Pass table', '逐趟表')}${arg.title ? ' — ' + T(arg.title[0], arg.title[1]) : ''}`, body, exp,
      intro: arg.vertical ? BOX('warn', 'The answer sheet draws each array <b>vertically with [0] at the bottom</b>. Copy carefully — reading upward is where people swap two cells by accident.', '答题纸把每个数组<b>竖着画，[0] 在最下面</b>。抄写要小心——从下往上读最容易把两格抄反。') : '',
      model: `<div class="note">${notes[alg] || ''}</div>`,
      newData: arg.fixed ? null : () => { arg.random = true; draw(); },
      after: e => { const s = $('.algsel', e); if (s) s.onchange = () => { alg = s.value; draw(); }; } });
  };
  draw();
};

/* ---------- bubble trace rows (pass, x, compare, output, arr) ---------- */
SITE.widgets.sheetBubbleRows = (el, arg = {}) => {
  let arr = arg.arr ? arg.arr.slice() : null;
  const draw = () => {
    if (!arr || arg.random) arr = T1RANDARR(4, 1, 20);
    const rows = T1.bubbleRows(arr), exp = {};
    let body = `${codeHTML(`int arr[] = {${arr.join(', ')}};\nfor (int pass = 1; pass < 4; pass++) {\n    for (int x = 0; x < 3; x++) {\n        if (arr[x] > arr[x+1]) {\n            cout << "swap" << "\\n";\n            temp = arr[x]; arr[x] = arr[x+1]; arr[x+1] = temp;\n        } else {\n            cout << "no swap" << "\\n";\n        }\n    }\n}`)}
    <div class="t1cells"><table class="t"><tr><th>pass</th><th>x</th><th>arr[x] &gt; arr[x+1]</th><th>${T('Output', '输出')}</th><th>arr</th></tr>`;
    rows.forEach((r, k) => {
      exp[`g${k}`] = r.gt ? 'true' : 'false'; exp[`o${k}`] = r.gt ? 'swap' : 'no swap'; exp[`a${k}`] = { v: t1fmt(r.a), cmp: t1arrEq, show: '{' + r.a.join(', ') + '}' };
      body += `<tr><td>${r.p}</td><td>${r.x}</td><td><code>${r.l} &gt; ${r.r}</code> ${t1sel('g' + k, [['true', 'true'], ['false', 'false']])}</td><td>${t1sel('o' + k, [['swap', 'swap'], ['no swap', 'no swap']])}</td><td>${t1in('a' + k, 'm')}</td></tr>`;
    });
    body += `</table></div>`;
    t1Form(el, { title: T('Bubble sort trace table', '冒泡排序追踪表'), body, exp,
      intro: P('This code never shrinks the inner loop (always x = 0, 1, 2), so every pass prints three lines.', '这段代码内层循环不缩短（x 永远是 0、1、2），所以每趟都输出三行。'),
      newData: arg.fixed ? null : () => { arg.random = true; draw(); } });
  };
  draw();
};

/* ---------- recursion tracing template ---------- */
SITE.widgets.sheetRec = (el, arg = {}) => {
  let fn = arg.fn, args = arg.args;
  const rand = () => {
    const pick = ['addDown', 'sum', 'meet', 'power', 'fact', 'triple', 'digits'][rint(0, 6)];
    const A = { addDown: () => [rint(2, 4), rint(1, 9)], sum: () => [rint(100, 999)], meet: () => { const x = rint(1, 4); return [x, x + rint(2, 5)]; }, power: () => [rint(2, 3), rint(2, 4)],
      fact: () => [rint(3, 5)], triple: () => [2 * rint(1, 3)], digits: () => [rint(100, 9999)] }[pick]();
    fn = pick; args = A;
  };
  const draw = () => {
    if (!fn || arg.random) rand();
    const F = T1.REC[fn], fr = T1.recFrames(fn, args), exp = {};
    let body = `${codeHTML(`${F.sig} {\n${F.code.map(l => '    ' + l).join('\n')}\n}`)}<div class="t1row"><code>cout &lt;&lt; ${fn}(${args.join(', ')});</code></div>`;
    fr.forEach((f, k) => {
      exp[`a${k}`] = f.args.join(', '); exp[`r${k}`] = String(f.ret);
      exp[`k${k}`] = 'base' in f ? 'base' : 'general';
      if (!('base' in f)) exp[`n${k}`] = f.next.join(', ');
      body += `${k ? `<div class="t1arrow">↓ ${T('calls', '调用')}</div>` : ''}<div class="t1frame" style="margin-left:${Math.min(k, 4) * 8}px"><div class="t1row"><code>${fn}(</code>${k ? t1in('a' + k, 'm') : `<b>${f.args.join(', ')}</b>`}<code>)</code>
        <span>${T('case', '情况')}: ${t1sel('k' + k, [['base', 'base / 基本'], ['general', 'general / 一般']])}</span></div>
        <div class="t1row">${'base' in f ? `<span class="t1lab">${T('no further call', '不再调用')}</span>` : `<span>${T('next call', '下一次调用')}: <code>${fn}(</code>${t1in('n' + k, 'm')}<code>)</code></span>`}
        <span>↑ return ${t1in('r' + k, 'm')}</span></div></div>`;
      if (k === 0) exp[`a0`] = undefined;
    });
    exp.out = String(fr[0].ret);
    body += `<div class="t1row"><b>${T('Value printed', '打印的值')}</b> ${t1in('out', 'm')}</div>`;
    t1Form(el, { title: `${T('Recursion trace template', '递归追踪模板')}${arg.title ? ' — ' + T(arg.title[0], arg.title[1]) : ''}`,
      intro: P('Go <b>down</b> writing each call’s arguments, then come back <b>up</b> filling the return values from the base case to the first call. Integer division: <code>123 / 10 = 12</code>.', '先往<b>下</b>写每次调用的参数，再从基本情况往<b>上</b>回填返回值，直到第一次调用。整数除法：<code>123 / 10 = 12</code>。'),
      body, exp, newData: arg.fixed ? null : () => { arg.random = true; draw(); },
      model: `<div class="note">${fr.map(f => `${fn}(${f.args.join(', ')})`).join(' → ')} ⇒ ${T('returns', '返回')} ${fr.slice().reverse().map(f => f.ret).join(' → ')}</div>` });
  };
  draw();
};

/* ---------- step-count table (count iterations per line) ---------- */
// every line in a loop counts as many times as the loop body runs; header line = number of iterations
const T1_STEPS = {
  triangle: { t: ['Dependent inner loop (b ≤ a)', '内层依赖外层（b ≤ a）'], rows: [['for (int a = 1; a <= n; a++)', 'n'], ['    for (int b = 1; b <= a; b++)', 'n(n+1)/2'], ['        cout << "step";', 'n(n+1)/2']],
    total: 'n + n(n+1)', big: 'n2', why: ['Inner loop runs 1 + 2 + … + n = n(n+1)/2 times in total.', '内层总共运行 1 + 2 + … + n = n(n+1)/2 次。'] }
};
const T1_BIGO = [['1', 'O(1)'], ['logn', 'O(log₂n)'], ['n', 'O(n)'], ['nlogn', 'O(n log₂n)'], ['n2', 'O(n²)'], ['n3', 'O(n³)'], ['2n', 'O(2ⁿ)']];
function t1RandSteps() {
  const kind = rint(0, 4), a = rint(0, 3), lt = rint(0, 1), up = lt ? `i < n` : `i <= n`, it = lt ? `n-${a}` : (a ? `n-${a}+1` : 'n+1');
  const iters = lt ? `(n-${a})` : `(n-${a}+1)`;
  if (kind === 0) return { t: ['Random: single loop', '随机：单层循环'], rows: [['int sum = 0;', '1'], [`for (int i = ${a}; ${up}; i++) {`, iters], ['    sum = sum + i;', iters], ['    cout << sum;', iters], ['}', null]], total: `1 + 3${iters}`, big: 'n', why: [`Loop from ${a} ${lt ? 'to n−1' : 'to n'} → ${it} iterations (b − a + 1).`, `从 ${a} 到 ${lt ? 'n−1' : 'n'} → ${it} 次（b − a + 1）。`] };
  if (kind === 1) { const m = [2, 4][rint(0, 1)], s = [1, m][rint(0, 1)], cnt = s === 1 ? `(1+log${m}n)` : `log${m}n`;
    return { t: ['Random: multiplying loop', '随机：乘法循环'], rows: [[`int i = ${s};`, '1'], ['while (i <= n) {', cnt], ['    x++;', cnt], [`    i = i * ${m};`, cnt], ['}', null]], total: `1 + 3${cnt}`, big: 'logn', why: [`i = ${s}, ${s * m}, … ≤ n → ${s === 1 ? `1 + log${m}n` : `log${m}n`} iterations${s === 1 ? ' (i = 1 is counted too)' : ''}.`, `i = ${s}、${s * m}…≤ n → ${s === 1 ? `1 + log${m}n` : `log${m}n`} 轮${s === 1 ? '（i = 1 也算一轮）' : ''}。`] }; }
  if (kind === 2) return { t: ['Random: nested n × n', '随机：嵌套 n × n'], rows: [['for (int i = 1; i <= n; i++)', 'n'], ['    for (int j = 1; j <= n; j++)', 'n^2'], ['        cout << i * j;', 'n^2']], total: 'n + 2n^2', big: 'n2', why: ['Inner header and body run n · n times.', '内层循环头和循环体各运行 n · n 次。'] };
  if (kind === 3) return { t: ['Random: loop with a doubling inner loop', '随机：外层 n、内层翻倍'], rows: [['for (int i = 1; i <= n; i++) {', 'n'], ['    int j = 1;', 'n'], ['    while (j <= n) {', 'n(1+log2n)'], ['        cout << j;', 'n(1+log2n)'], ['        j = j * 2; }', 'n(1+log2n)'], ['}', null]], total: '2n + 3n(1+log2n)', big: 'nlogn', why: ['Each outer iteration runs the doubling loop 1 + log₂n times.', '外层每一轮，翻倍循环都跑 1 + log₂n 次。'] };
  return { t: ['Random: dependent inner loop', '随机：内层依赖外层'], rows: [['for (int a = 1; a <= n; a++)', 'n'], ['    for (int b = 1; b <= a; b++)', 'n(n+1)/2'], ['        cout << a + b;', 'n(n+1)/2']], total: 'n + n(n+1)', big: 'n2', why: ['1 + 2 + … + n = n(n+1)/2.', '1 + 2 + … + n = n(n+1)/2。'] };
}
const t1exprShow = s => s.replace(/log(\d)n/g, (m, b) => `log${'₀₁₂₃₄'[b]}n`).replace(/\^2/g, '²').replace(/-/g, ' − ').replace(/\+/g, ' + ');
SITE.widgets.sheetSteps = (el, arg = {}) => {
  let P_ = typeof arg === 'string' ? T1_STEPS[arg] : arg.key ? T1_STEPS[arg.key] : null;
  const draw = () => {
    if (!P_ || arg.random) P_ = t1RandSteps();
    const exp = {};
    let body = `<div class="t1cells"><table class="t"><tr><th>${T('Statement', '语句')}</th><th>${T('Number of steps', '步数')}</th></tr>`;
    P_.rows.forEach(([code, cnt], k) => {
      if (cnt !== null) exp[`r${k}`] = { v: cnt, cmp: (g, e) => T1.sameExpr(g, e), show: t1exprShow(cnt) };
      body += `<tr><td><code style="white-space:pre">${esc(code)}</code></td><td>${cnt === null ? '' : t1in('r' + k, 'm')}</td></tr>`;
    });
    exp.tot = { v: P_.total, cmp: (g, e) => T1.sameExpr(g, e), show: t1exprShow(P_.total) }; exp.big = P_.big;
    body += `<tr><td><b>${T('Total steps', '总步数')}</b></td><td>${t1in('tot', 'w')}</td></tr><tr><td><b>Big-O</b></td><td>${t1sel('big', T1_BIGO)}</td></tr></table></div>`;
    t1Form(el, { title: `${T('Step-count table', '步数表')} — ${T(P_.t[0], P_.t[1])}`, body, exp,
      intro: P('Method: a loop header counts the <b>number of iterations</b>; each line inside counts the same; nested lines multiply. Type expressions like <code>n-1</code>, <code>(n-1)log4n</code>, <code>n^2</code>, <code>2n(1+log2n)</code> — any equivalent form is accepted.', '方法：循环头记<b>迭代次数</b>；循环里每行同样多；嵌套就相乘。输入 <code>n-1</code>、<code>(n-1)log4n</code>、<code>n^2</code>、<code>2n(1+log2n)</code> 这类表达式——等价写法都算对。'),
      model: `<div class="note">${T(P_.why[0], P_.why[1])}<br>${T('Total', '总步数')} = ${t1exprShow(P_.total)} → <b>${T1_BIGO.find(b => b[0] === P_.big)[1]}</b></div>`,
      newData: arg.fixed ? null : () => { arg = { random: true }; draw(); } });
  };
  draw();
};

void mergeSort(int a[], int first, int last) {
    if (first < last) {
        int mid = (first + last) / 2;
        mergeSort(a, first, mid);       // left half includes mid
        mergeSort(a, mid + 1, last);
        merge(a, first, mid, last);     // both halves are sorted now

}`}

int partition(int a[], int first, int last) {

        do { bottom++; } while (a[bottom] < pivot);  // bottom stops at a value >= pivot
        if (bottom < top) swap(a[bottom], a[top]);
        else return top;                             // the cut point
    }
}
